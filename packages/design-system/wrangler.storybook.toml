name = "lightproject-storybook"
compatibility_date = "2026-08-26"

[assets]
directory = "./storybook-static"
not_found_handling = "single-page-application"

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[observability.traces]
enabled = true
persist = true

[env.develop]
name = "lightproject-storybook-dev"

[env.staging]
name = "lightproject-storybook-staging"

[env.production]
name = "lightproject-storybook-production"
