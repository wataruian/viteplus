server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html/vite;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json application/manifest+json image/svg+xml;
  gzip_disable "MSIE [1-6]\.";

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  location ^~ /assets/ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ~* \.(?:ico|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
    expires 7d;
    access_log off;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
  }
}

