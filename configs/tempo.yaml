server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s

storage:
  trace:
    backend: local

    local:
      path: /tmp/tempo/traces

    wal:
      path: /tmp/tempo/wal

compactor:
  compaction:
    block_retention: 48h

metrics_generator:
  registry:
    external_labels:
      source: tempo
