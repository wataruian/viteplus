extensions:
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - 'http://*'
            - 'https://*'
          allowed_headers:
            - '*'

  faro:
    endpoint: 0.0.0.0:12347
    cors:
      allowed_origins:
        - 'http://*'
        - 'https://*'
      allowed_headers:
        - '*'

processors:
  transform/faro-logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - merge_maps(log.cache, ExtractPatterns(log.body, "(?:^|\\s)context_requestId=(?P<request_id>[^\\s\"]+)"), "upsert") where log.attributes["kind"] == "log" and IsString(log.body)
          - merge_maps(log.cache, ExtractPatterns(log.body, "(?:^|\\s)context_clientId=(?P<client_id>[^\\s\"]+)"), "upsert") where log.attributes["kind"] == "log" and IsString(log.body)
          - set(log.attributes["request.id"], log.cache["request_id"]) where log.cache["request_id"] != nil
          - set(log.attributes["client.id"], log.cache["client_id"]) where log.cache["client_id"] != nil

  transform/redact-urls:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - replace_all_patterns(resource.attributes, "value", "((?:^|[\\s:\"'(=])//)[^/?#,\\s\"'\\\\]*@", "$${1}REDACTED@")
          - replace_all_patterns(resource.attributes, "value", "(?i)([?&#][^=&#\\s\"'\\\\]*(?:password|secret|token|api[-_]?key|auth|cookie)[^=&#\\s\"'\\\\]*=)[^&#\\s\"'\\\\]*", "$${1}REDACTED")
          - replace_all_patterns(resource.attributes, "value", "(?i)(%22[^%]*(?:password|secret|token|api[-_]?key|auth|cookie)[^%]*%22(?:%3A|:)(?:%20|\\s)*%22)(?:%5[Cc]%[0-9A-Fa-f]{2}|[^%]|%[013-9A-Fa-f][0-9A-Fa-f]|%2[0-13-9A-Fa-f])*(%22)", "$${1}REDACTED$${2}")
          - replace_all_patterns(resource.attributes, "value", "(?i)(%22[^%]*(?:password|secret|token|api[-_]?key|auth|cookie)[^%]*%22(?:%3A|:)(?:%20|\\s)*)(?:-?[0-9][0-9.eE+-]*|true|false|null)", "$${1}%22REDACTED%22")
      - context: span
        statements:
          - replace_all_patterns(span.attributes, "value", "((?:^|[\\s:\"'(=])//)[^/?#,\\s\"'\\\\]*@", "$${1}REDACTED@")
          - replace_all_patterns(span.attributes, "value", "(?i)([?&#][^=&#\\s\"'\\\\]*(?:password|secret|token|api[-_]?key|auth|cookie)[^=&#\\s\"'\\\\]*=)[^&#\\s\"'\\\\]*", "$${1}REDACTED")
          - replace_all_patterns(span.attributes, "value", "(?i)(%22[^%]*(?:password|secret|token|api[-_]?key|auth|cookie)[^%]*%22(?:%3A|:)(?:%20|\\s)*%22)(?:%5[Cc]%[0-9A-Fa-f]{2}|[^%]|%[013-9A-Fa-f][0-9A-Fa-f]|%2[0-13-9A-Fa-f])*(%22)", "$${1}REDACTED$${2}")
          - replace_all_patterns(span.attributes, "value", "(?i)(%22[^%]*(?:password|secret|token|api[-_]?key|auth|cookie)[^%]*%22(?:%3A|:)(?:%20|\\s)*)(?:-?[0-9][0-9.eE+-]*|true|false|null)", "$${1}%22REDACTED%22")
      - context: spanevent
        statements:
          - replace_all_patterns(spanevent.attributes, "value", "((?:^|[\\s:\"'(=])//)[^/?#,\\s\"'\\\\]*@", "$${1}REDACTED@")
          - replace_all_patterns(spanevent.attributes, "value", "(?i)([?&#][^=&#\\s\"'\\\\]*(?:password|secret|token|api[-_]?key|auth|cookie)[^=&#\\s\"'\\\\]*=)[^&#\\s\"'\\\\]*", "$${1}REDACTED")
          - replace_all_patterns(spanevent.attributes, "value", "(?i)(%22[^%]*(?:password|secret|token|api[-_]?key|auth|cookie)[^%]*%22(?:%3A|:)(?:%20|\\s)*%22)(?:%5[Cc]%[0-9A-Fa-f]{2}|[^%]|%[013-9A-Fa-f][0-9A-Fa-f]|%2[0-13-9A-Fa-f])*(%22)", "$${1}REDACTED$${2}")
          - replace_all_patterns(spanevent.attributes, "value", "(?i)(%22[^%]*(?:password|secret|token|api[-_]?key|auth|cookie)[^%]*%22(?:%3A|:)(?:%20|\\s)*)(?:-?[0-9][0-9.eE+-]*|true|false|null)", "$${1}%22REDACTED%22")
    log_statements:
      - context: resource
        statements:
          - replace_all_patterns(resource.attributes, "value", "((?:^|[\\s:\"'(=])//)[^/?#,\\s\"'\\\\]*@", "$${1}REDACTED@")
          - replace_all_patterns(resource.attributes, "value", "(?i)([?&#][^=&#\\s\"'\\\\]*(?:password|secret|token|api[-_]?key|auth|cookie)[^=&#\\s\"'\\\\]*=)[^&#\\s\"'\\\\]*", "$${1}REDACTED")
          - replace_all_patterns(resource.attributes, "value", "(?i)(%22[^%]*(?:password|secret|token|api[-_]?key|auth|cookie)[^%]*%22(?:%3A|:)(?:%20|\\s)*%22)(?:%5[Cc]%[0-9A-Fa-f]{2}|[^%]|%[013-9A-Fa-f][0-9A-Fa-f]|%2[0-13-9A-Fa-f])*(%22)", "$${1}REDACTED$${2}")
          - replace_all_patterns(resource.attributes, "value", "(?i)(%22[^%]*(?:password|secret|token|api[-_]?key|auth|cookie)[^%]*%22(?:%3A|:)(?:%20|\\s)*)(?:-?[0-9][0-9.eE+-]*|true|false|null)", "$${1}%22REDACTED%22")
      - context: log
        statements:
          - replace_all_patterns(log.attributes, "value", "((?:^|[\\s:\"'(=])//)[^/?#,\\s\"'\\\\]*@", "$${1}REDACTED@")
          - replace_all_patterns(log.attributes, "value", "(?i)([?&#][^=&#\\s\"'\\\\]*(?:password|secret|token|api[-_]?key|auth|cookie)[^=&#\\s\"'\\\\]*=)[^&#\\s\"'\\\\]*", "$${1}REDACTED")
          - replace_all_patterns(log.attributes, "value", "(?i)(%22[^%]*(?:password|secret|token|api[-_]?key|auth|cookie)[^%]*%22(?:%3A|:)(?:%20|\\s)*%22)(?:%5[Cc]%[0-9A-Fa-f]{2}|[^%]|%[013-9A-Fa-f][0-9A-Fa-f]|%2[0-13-9A-Fa-f])*(%22)", "$${1}REDACTED$${2}")
          - replace_all_patterns(log.attributes, "value", "(?i)(%22[^%]*(?:password|secret|token|api[-_]?key|auth|cookie)[^%]*%22(?:%3A|:)(?:%20|\\s)*)(?:-?[0-9][0-9.eE+-]*|true|false|null)", "$${1}%22REDACTED%22")
          - replace_pattern(log.body, "((?:^|[\\s:\"'(=])//)[^/?#,\\s\"'\\\\]*@", "$${1}REDACTED@") where IsString(log.body)
          - replace_pattern(log.body, "(?i)([?&#][^=&#\\s\"'\\\\]*(?:password|secret|token|api[-_]?key|auth|cookie)[^=&#\\s\"'\\\\]*=)[^&#\\s\"'\\\\]*", "$${1}REDACTED") where IsString(log.body)
          - replace_pattern(log.body, "(?i)(%22[^%]*(?:password|secret|token|api[-_]?key|auth|cookie)[^%]*%22(?:%3A|:)(?:%20|\\s)*%22)(?:%5[Cc]%[0-9A-Fa-f]{2}|[^%]|%[013-9A-Fa-f][0-9A-Fa-f]|%2[0-13-9A-Fa-f])*(%22)", "$${1}REDACTED$${2}") where IsString(log.body)
          - replace_pattern(log.body, "(?i)(%22[^%]*(?:password|secret|token|api[-_]?key|auth|cookie)[^%]*%22(?:%3A|:)(?:%20|\\s)*)(?:-?[0-9][0-9.eE+-]*|true|false|null)", "$${1}%22REDACTED%22") where IsString(log.body)
          - replace_all_patterns(log.body, "value", "((?:^|[\\s:\"'(=])//)[^/?#,\\s\"'\\\\]*@", "$${1}REDACTED@") where IsMap(log.body)
          - replace_all_patterns(log.body, "value", "(?i)([?&#][^=&#\\s\"'\\\\]*(?:password|secret|token|api[-_]?key|auth|cookie)[^=&#\\s\"'\\\\]*=)[^&#\\s\"'\\\\]*", "$${1}REDACTED") where IsMap(log.body)
          - replace_all_patterns(log.body, "value", "(?i)(%22[^%]*(?:password|secret|token|api[-_]?key|auth|cookie)[^%]*%22(?:%3A|:)(?:%20|\\s)*%22)(?:%5[Cc]%[0-9A-Fa-f]{2}|[^%]|%[013-9A-Fa-f][0-9A-Fa-f]|%2[0-13-9A-Fa-f])*(%22)", "$${1}REDACTED$${2}") where IsMap(log.body)
          - replace_all_patterns(log.body, "value", "(?i)(%22[^%]*(?:password|secret|token|api[-_]?key|auth|cookie)[^%]*%22(?:%3A|:)(?:%20|\\s)*)(?:-?[0-9][0-9.eE+-]*|true|false|null)", "$${1}%22REDACTED%22") where IsMap(log.body)

  deltatocumulative:
    max_stale: 5m

  resource/metrics:
    attributes:
      - key: service_name
        from_attribute: service.name
        action: upsert

  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  prometheusremotewrite:
    endpoint: http://mimir:9009/api/v1/push
    resource_to_telemetry_conversion:
      enabled: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    sending_queue:
      storage: file_storage

  otlp/tempo:
    endpoint: http://tempo:4317
    tls:
      insecure: true
    sending_queue:
      storage: file_storage

  debug:
    verbosity: detailed

service:
  extensions:
    - file_storage

  telemetry:
    logs:
      level: info

  pipelines:
    metrics:
      exporters:
        - prometheusremotewrite
        - debug
      processors:
        - deltatocumulative
        - resource/metrics
        - batch
      receivers:
        - otlp

    logs:
      exporters:
        - otlphttp/loki
        - debug
      processors:
        - transform/faro-logs
        - transform/redact-urls
        - batch
      receivers:
        - otlp
        - faro

    traces:
      exporters:
        - otlp/tempo
        - debug
      processors:
        - transform/redact-urls
        - batch
      receivers:
        - otlp
        - faro
