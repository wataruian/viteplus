name: 'Semgrep'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: [self-hosted, dagger]
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Mise
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.7.3

      - name: Scan for SAST findings
        shell: bash
        run: mise run semgrep-scan

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: semgrep-sarif
          path: tmp/semgrep/semgrep.sarif
          retention-days: 14

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ./tmp/semgrep
          sarif_file="./tmp/semgrep/semgrep.sarif"

          {
            echo '<!-- semgrep-report -->'
            echo '### Semgrep report'
            echo ''
            if [[ -s "${sarif_file}" ]]; then
              count="$(jq '[.runs[0].results[]?] | length' "${sarif_file}")"
              if [[ "${count}" -eq 0 ]]; then
                echo '✅ No findings.'
              else
                echo "Found **${count}** finding(s):"
                echo ''
                echo '| Severity | Rule | Location | Message |'
                echo '|---|---|---|---|'
                jq -r '
                  [.runs[0].results[]?][0:50][] |
                  [
                    (.level // "warning"),
                    .ruleId,
                    (.locations[0].physicalLocation.artifactLocation.uri + ":" + (.locations[0].physicalLocation.region.startLine | tostring)),
                    (.message.text | gsub("\r?\n"; " ") | gsub("\\|"; "\\|"))
                  ] | "| " + join(" | ") + " |"
                ' "${sarif_file}"
                if [[ "${count}" -gt 50 ]]; then
                  echo ''
                  echo "_Showing first 50 of ${count} findings. See the \`semgrep-sarif\` workflow artifact for the full report._"
                fi
              fi
            else
              echo '_No SARIF report was produced (the scan likely errored before completing)._'
            fi
          } > tmp/semgrep/body.md
          cat tmp/semgrep/body.md

          existing_id="$(
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              --paginate \
              --jq '.[] | select(.body | startswith("<!-- semgrep-report -->")) | .id' \
              | head -1
          )"

          if [[ -n "${existing_id}" ]]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${existing_id}" -F body=@tmp/semgrep/body.md
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -F body=@tmp/semgrep/body.md
          fi
