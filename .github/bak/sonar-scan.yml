name: 'Sonar Scan'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: sonar-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube
    runs-on: [self-hosted, dagger]
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Mise
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.7.3

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          version: 0.3.1
          run-install: true

      - name: Check
        shell: bash
        run: vp run -r check

      - name: Format
        shell: bash
        run: vp run -r format

      - name: Lint
        shell: bash
        run: vp run -r lint

      - name: Type Check
        shell: bash
        run: vp run -r type-check

      - name: Build
        shell: bash
        run: vp run -r build

      - name: Test
        shell: bash
        run: vp run -r test

      - name: Run SonarQube analysis
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mise run sonar-scan

      - name: Upload Sonar report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sonar-report
          path: |
            tmp/sonar/report-task.txt
            tmp/sonar/ce-task.json
            tmp/sonar/sonar-quality-gate.json
            tmp/sonar/sonar-issues.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ./tmp/sonar
          quality_gate_file="./tmp/sonar/sonar-quality-gate.json"
          issues_file="./tmp/sonar/sonar-issues.json"

          {
            echo '<!-- sonarqube-report -->'
            echo '### SonarQube report'
            echo ''
            if [[ -s "${quality_gate_file}" ]]; then
              gate_status="$(jq -r '.projectStatus.status // "UNKNOWN"' "${quality_gate_file}")"
              if [[ "${gate_status}" == "OK" ]]; then
                echo "✅ Quality gate **passed**."
              else
                echo "❌ Quality gate **${gate_status}**."
              fi
              echo ''
              conditions="$(jq -r '.projectStatus.conditions[]? | select(.status != "OK")' "${quality_gate_file}")"
              if [[ -n "${conditions}" ]]; then
                echo '| Status | Metric | Actual | Threshold |'
                echo '|---|---|---|---|'
                jq -r '
                  .projectStatus.conditions[]? | select(.status != "OK") |
                  [.status, .metricKey, (.actualValue // "-"), (.errorThreshold // "-")] | "| " + join(" | ") + " |"
                ' "${quality_gate_file}"
                echo ''
              fi
            else
              echo '_No quality gate result was produced (the analysis likely errored before completing)._'
              echo ''
            fi

            if [[ -s "${issues_file}" ]]; then
              total="$(jq -r '.total // 0' "${issues_file}")"
              if [[ "${total}" -eq 0 ]]; then
                echo '✅ No open issues.'
              else
                echo "Found **${total}** open issue(s):"
                echo ''
                echo '| Severity | Rule | Location | Message |'
                echo '|---|---|---|---|'
                jq -r '
                  .issues[]? |
                  [
                    .severity,
                    .rule,
                    ((.component | split(":") | last) + ":" + (.line // "-" | tostring)),
                    (.message | gsub("\r?\n"; " ") | gsub("\\|"; "\\|"))
                  ] | "| " + join(" | ") + " |"
                ' "${issues_file}"
                if [[ "${total}" -gt 50 ]]; then
                  echo ''
                  echo "_Showing first 50 of ${total} issues. See the \`sonar-report\` workflow artifact for the full report._"
                fi
              fi
            fi
          } > tmp/sonar/body.md
          cat tmp/sonar/body.md

          existing_id="$(
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              --paginate \
              --jq '.[] | select(.body | startswith("<!-- sonarqube-report -->")) | .id' \
              | head -1
          )"

          if [[ -n "${existing_id}" ]]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${existing_id}" -F body=@tmp/sonar/body.md
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -F body=@tmp/sonar/body.md
          fi
