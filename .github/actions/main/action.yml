name: 'Main pipeline'
description: 'The main pipeline for the monorepo'

inputs:
  environment:
    description: 'Environment to run the pipeline'
    required: true
    type: string
  workspace:
    description: 'Workspace to run the pipeline'
    required: true
    type: string

runs:
  using: 'composite'
  steps:
    - name: Set up Mise
      uses: jdx/mise-action@v4.3.0
      with:
        version: 2026.7.3

    - name: Setup configs
      id: setup-configs
      shell: bash
      run: |
        echo "mise version:"
        mise_version="$(mise --version 2>/dev/null | head -n1 | awk '{print $1}')"
        echo "${mise_version}"
        echo " "

        echo "node version:"
        node --version
        echo " "

        echo "pnpm version:"
        pnpm --version
        echo " "

        dagger_version="$(dagger version | awk '{print $2}' | sed 's/^//')"
        echo "dagger_version=${dagger_version}" >> "${GITHUB_OUTPUT}"
        echo "dagger version:"
        echo "${dagger_version}"

    - name: Setup Dagger
      if: steps.dagger-sdk-cache.outputs.cache-hit != 'true'
      shell: bash
      run: dagger develop

    - name: Check
      shell: bash
      run: mise run dagger-artifact check "${{ inputs.workspace }}"

    - name: Format
      shell: bash
      run: mise run dagger-artifact format "${{ inputs.workspace }}"

    - name: Lint
      shell: bash
      run: mise run dagger-artifact lint "${{ inputs.workspace }}"

    - name: Type Check
      shell: bash
      run: mise run dagger-artifact type-check "${{ inputs.workspace }}"

    - name: Build
      shell: bash
      run: mise run dagger-artifact build "${{ inputs.workspace }}"
