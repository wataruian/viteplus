name: 'Base setup'
description: 'Set up Mise, Vite+, and the Dagger SDK, then run the vp and/or dagger pipelines'

inputs:
  run-vp:
    description: 'Whether to run the vp pipeline'
    default: 'true'
  vp-args:
    description: 'Arguments passed to `vp run`'
    default: '-r root'
  run-dagger:
    description: 'Whether to run the dagger pipeline'
    default: 'false'
  dagger-call:
    description: 'Target passed to `dagger call`'
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Mise
      uses: jdx/mise-action@v4.3.0
      with:
        version: 2026.7.3

    - name: Set up Vite+
      uses: voidzero-dev/setup-vp@v1.19.0
      with:
        version: 0.3.0
        cache: true
        run-install: true

    - name: Setup configs
      id: setup-configs
      shell: bash
      run: |
        echo "mise version:"
        mise_version="$(mise --version 2>/dev/null | head -n1 | awk '{print $1}')"
        echo "${mise_version}"
        echo " "

        echo "node version:"
        node --version
        echo " "

        echo "pnpm version:"
        pnpm --version
        echo " "

        echo "vp version:"
        vp --version
        echo " "

        dagger_version="$(dagger version | awk '{print $2}' | sed 's/^//')"
        echo "dagger_version=${dagger_version}" >> "${GITHUB_OUTPUT}"
        echo "dagger version:"
        echo "${dagger_version}"

    - name: Restore Dagger SDK cache
      id: dagger-sdk-cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: .dagger/sdk
        key: dagger-sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-configs.outputs.dagger_version }}-${{ hashFiles('dagger.json', '.dagger/src/index.ts', '.dagger/package.json', '.dagger/pnpm-lock.yaml', '.dagger/tsconfig.json') }}

    - name: Setup Dagger
      if: steps.dagger-sdk-cache.outputs.cache-hit != 'true'
      shell: bash
      run: dagger develop

    - name: Save Dagger SDK cache
      if: success() && steps.dagger-sdk-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: .dagger/sdk
        key: ${{ steps.dagger-sdk-cache.outputs.cache-primary-key }}

    - name: Run vp pipeline
      if: inputs.run-vp == 'true'
      uses: ./.github/actions/vp
      with:
        args: ${{ inputs.vp-args }}

    - name: Run dagger pipeline
      if: inputs.run-dagger == 'true'
      uses: ./.github/actions/dagger
      with:
        call: ${{ inputs.dagger-call }}
        dagger-version: ${{ steps.setup-configs.outputs.dagger_version }}
