name: 'Base setup'
description: 'Set up Mise and the Dagger SDK, then run the dagger pipeline'

inputs:
  dagger-calls:
    description: 'Newline-separated `dagger call` targets to run against one engine session'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up Mise
      uses: jdx/mise-action@v4.3.0
      with:
        version: 2026.7.3

    - name: Setup configs
      id: setup-configs
      shell: bash
      run: |
        echo "mise version:"
        mise_version="$(mise --version 2>/dev/null | head -n1 | awk '{print $1}')"
        echo "${mise_version}"
        echo " "

        echo "node version:"
        node --version
        echo " "

        echo "pnpm version:"
        pnpm --version
        echo " "

        dagger_version="$(dagger version | awk '{print $2}' | sed 's/^//')"
        echo "dagger_version=${dagger_version}" >> "${GITHUB_OUTPUT}"
        echo "dagger version:"
        echo "${dagger_version}"

    - name: Restore Dagger SDK cache
      id: dagger-sdk-cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: .dagger/sdk
        key: dagger-sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-configs.outputs.dagger_version }}-${{ hashFiles('dagger.json', '.dagger/src/index.ts', '.dagger/package.json', '.dagger/pnpm-lock.yaml', '.dagger/tsconfig.json') }}

    - name: Setup Dagger
      if: steps.dagger-sdk-cache.outputs.cache-hit != 'true'
      shell: bash
      run: dagger develop

    - name: Save Dagger SDK cache
      if: success() && steps.dagger-sdk-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: .dagger/sdk
        key: ${{ steps.dagger-sdk-cache.outputs.cache-primary-key }}

    - name: Run dagger pipeline
      uses: ./.github/actions/dagger
      with:
        calls: ${{ inputs.dagger-calls }}
        dagger-version: ${{ steps.setup-configs.outputs.dagger_version }}
