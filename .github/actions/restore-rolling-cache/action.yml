name: 'Restore rolling GitHub Actions cache'
description: 'Restore a cache keyed per-run, falling back to the newest entry under a stable prefix'

inputs:
  path:
    description: 'Path to cache'
    required: true
  prefix:
    description: 'Stable cache key prefix, including its trailing separator (e.g. "vite-task-Linux-X64-")'
    required: true

outputs:
  cache-hit:
    description: 'Whether there was an exact match on the primary (per-run) key'
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-primary-key:
    description: 'The primary key computed for this run; reuse it as the save key'
    value: ${{ steps.restore.outputs.cache-primary-key }}
  cache-matched-key:
    description: 'The key of the cache entry that was actually restored, if any'
    value: ${{ steps.restore.outputs.cache-matched-key }}

runs:
  using: 'composite'
  steps:
    - name: Restore cache ${{ inputs.prefix }}
      id: restore
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ inputs.prefix }}
