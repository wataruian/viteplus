name: 'Setup toolchain'
description: 'Set up Mise, which installs Vite+ and the other tools in mise.toml (assumes the repo is already checked out)'

inputs:
  mise-version:
    description: 'Mise version'
    required: false
    default: '2026.10.23'
  run-install:
    description: 'Run vp install after setup'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: ${{ inputs.mise-version }}

    - name: Install dependencies
      if: ${{ inputs.run-install == 'true' }}
      shell: bash
      run: vp install
