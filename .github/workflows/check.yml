name: 'CI Pipeline'

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to run (develop, staging, production). Leave unset to run without one, e.g. for PR checks.'
        required: false
        type: string
      workspace:
        description: 'Single workspace to run (design-system, frontend, backend). Leave unset to run the full matrix.'
        required: false
        type: string

jobs:
  checks:
    name: ${{ matrix.workspace }}
    runs-on: [self-hosted, dagger]
    environment: ${{ inputs.environment || null }}
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://dagger-engine
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ inputs.workspace && fromJson(format('["{0}"]', inputs.workspace)) || fromJson('["design-system","frontend","backend"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Mise
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.7.3

      - name: Setup configs
        shell: bash
        run: |
          echo "mise version:"
          mise_version="$(mise --version 2>/dev/null | head -n1 | awk '{print $1}')"
          echo "${mise_version}"
          echo " "

          echo "node version:"
          node --version
          echo " "

          echo "pnpm version:"
          pnpm --version
          echo " "

          dagger_version="$(dagger version | awk '{print $2}' | sed 's/^//')"
          echo "dagger version:"
          echo "${dagger_version}"

          echo "DAGGER_NO_NAG=1" >> "${GITHUB_ENV}"

      - name: Setup Dagger
        shell: bash
        run: dagger develop

      - name: Check
        shell: bash
        run: mise run dagger-artifact check "@lightproject/${{ matrix.workspace }}"

      - name: Format
        shell: bash
        run: mise run dagger-artifact format "@lightproject/${{ matrix.workspace }}"

      - name: Lint
        shell: bash
        run: mise run dagger-artifact lint "@lightproject/${{ matrix.workspace }}"

      - name: Type Check
        shell: bash
        run: mise run dagger-artifact type-check "@lightproject/${{ matrix.workspace }}"

      - name: Build
        shell: bash
        env:
          REGISTRY_ADDRESS: ${{ vars.REGISTRY_ADDRESS }}
        run: |
          if [[ -n "${{ inputs.environment }}" ]]; then
            mise run publish "@lightproject/${{ matrix.workspace }}" "${REGISTRY_ADDRESS}/${{ matrix.workspace }}" "${GITHUB_SHA::7}"
          else
            mise run dagger-artifact build "@lightproject/${{ matrix.workspace }}"
          fi

      - name: Test
        shell: bash
        run: mise run dagger-artifact test "@lightproject/${{ matrix.workspace }}"

      - name: Deploy
        if: inputs.environment != ''
        shell: bash
        run: |
          echo "Deploying: ${{ matrix.workspace }} (${{ inputs.environment }})"
          echo "✅ All good!"
