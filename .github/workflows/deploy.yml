name: 'Deploy'

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: string
      workspace:
        description: 'Workspace'
        required: false
        type: string
      ref:
        description: 'Git tag/ref to deploy (defaults to the triggering ref, i.e. latest main)'
        required: false
        type: string

jobs:
  setup:
    name: Setup
    runs-on: [self-hosted, dagger]
    timeout-minutes: 5
    outputs:
      workspaces: ${{ steps.workspaces.outputs.workspaces }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Mise
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.7.3

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          version: 0.3.1
          run-install: true

      - name: Resolve workspaces
        id: workspaces
        shell: bash
        env:
          WORKSPACE_INPUT: ${{ inputs.workspace }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          all="design-system frontend backend"

          if [[ -n "${WORKSPACE_INPUT}" ]]; then
            list="${WORKSPACE_INPUT}"
          elif [[ "${EVENT_NAME}" == "push" && -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            changedFiles="$(git diff --name-only "${BEFORE_SHA}...HEAD")"

            if [[ -z "${changedFiles}" ]] || grep -qvE '^(apps|packages)/' <<< "${changedFiles}"; then
              list="${all}"
            else
              affected="$(vp pm list -r --json --only-projects --filter "...[${BEFORE_SHA}]" | jq -r '.[].name')"
              list=""
              for workspace in ${all}; do
                if grep -qx "@lightproject/${workspace}" <<< "${affected}"; then
                  list+="${workspace} "
                fi
              done
              list="${list% }"
            fi
          else
            list="${all}"
          fi

          json="["
          for workspace in ${list}; do
            json+="\"${workspace}\","
          done
          json="${json%,}]"

          echo "::group::Resolved workspaces"
          echo "before sha: ${BEFORE_SHA}"
          echo "changed files:"
          echo "${changedFiles:-<none>}"
          echo "affected (vp pm list):"
          echo "${affected:-<none>}"
          echo "resolved list: ${list}"
          echo "workspaces json: ${json}"
          echo "::endgroup::"

          echo "workspaces=${json}" >> "${GITHUB_OUTPUT}"

  design-system:
    needs: setup
    if: >-
      !cancelled() &&
      contains(fromJson(needs.setup.outputs.workspaces), 'design-system')
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-workspace.yml
    secrets: inherit
    with:
      workspace: design-system
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}

  backend:
    needs: setup
    if: >-
      !cancelled() &&
      contains(fromJson(needs.setup.outputs.workspaces), 'backend')
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-workspace.yml
    secrets: inherit
    with:
      workspace: backend
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}

  frontend:
    needs: [setup, backend]
    if: >-
      !cancelled() &&
      contains(fromJson(needs.setup.outputs.workspaces), 'frontend') &&
      needs.backend.result != 'failure' &&
      needs.backend.result != 'cancelled'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-workspace.yml
    secrets: inherit
    with:
      workspace: frontend
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}
