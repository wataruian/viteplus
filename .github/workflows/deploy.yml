name: 'Deploy'

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: string
      workspace:
        description: 'Workspace'
        required: false
        type: string
      ref:
        description: 'Git tag/ref to deploy (defaults to the triggering ref, i.e. latest main)'
        required: false
        type: string

jobs:
  setup:
    name: Setup
    runs-on: [self-hosted, dagger]
    timeout-minutes: 5
    outputs:
      workspaces: ${{ steps.workspaces.outputs.workspaces }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-mise: 'false'

      - name: Resolve workspaces
        id: workspaces
        uses: ./.github/actions/resolve-workspaces
        with:
          workspace-input: ${{ inputs.workspace }}
          all-workspaces: 'design-system frontend backend'

  design-system:
    needs: setup
    if: >-
      !cancelled() &&
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'design-system')
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-workspace.yml
    secrets: inherit
    with:
      workspace: design-system
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}

  backend:
    needs: setup
    if: >-
      !cancelled() &&
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'backend')
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-workspace.yml
    secrets: inherit
    with:
      workspace: backend
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}

  frontend:
    needs: [setup, design-system, backend]
    if: >-
      !cancelled() &&
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'frontend') &&
      needs.design-system.result != 'failure' &&
      needs.design-system.result != 'cancelled' &&
      needs.backend.result != 'failure' &&
      needs.backend.result != 'cancelled'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-workspace.yml
    secrets: inherit
    with:
      workspace: frontend
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}
