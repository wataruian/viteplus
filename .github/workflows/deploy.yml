name: 'Deploy'

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: string
      workspace:
        description: 'Workspace'
        required: false
        type: string
      ref:
        description: 'Git tag/ref to deploy (defaults to the triggering ref, i.e. latest main)'
        required: false
        type: string

jobs:
  setup:
    name: Setup
    runs-on: [self-hosted, linux, arm64, dagger]
    timeout-minutes: 5
    outputs:
      workspaces: ${{ steps.workspaces.outputs.workspaces }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Resolve workspaces
        id: workspaces
        uses: ./.github/actions/resolve-workspaces
        with:
          workspace-input: ${{ inputs.workspace }}
          all-workspaces: 'datastore design-system scheduler tasks backend frontend'

  datastore:
    needs: setup
    if: >-
      !cancelled() &&
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'datastore')
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-workspace.yml
    secrets: inherit
    with:
      workspace: datastore
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}

  design-system:
    needs: setup
    if: >-
      !cancelled() &&
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'design-system')
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-workspace.yml
    secrets: inherit
    with:
      workspace: design-system
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}

  scheduler:
    needs: [setup, datastore]
    if: >-
      !cancelled() &&
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'scheduler') &&
      needs.datastore.result != 'failure' &&
      needs.datastore.result != 'cancelled'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-workspace.yml
    secrets: inherit
    with:
      workspace: scheduler
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}

  tasks:
    needs: [setup, datastore]
    if: >-
      !cancelled() &&
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'tasks') &&
      needs.datastore.result != 'failure' &&
      needs.datastore.result != 'cancelled'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-workspace.yml
    secrets: inherit
    with:
      workspace: tasks
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}

  backend:
    needs: [setup, datastore, tasks]
    if: >-
      !cancelled() &&
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'backend') &&
      needs.datastore.result != 'failure' &&
      needs.datastore.result != 'cancelled' &&
      needs.tasks.result != 'failure' &&
      needs.tasks.result != 'cancelled'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-workspace.yml
    secrets: inherit
    with:
      workspace: backend
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}

  frontend:
    needs: [setup, datastore, design-system, tasks, backend]
    if: >-
      !cancelled() &&
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'frontend') &&
      needs.datastore.result != 'failure' &&
      needs.datastore.result != 'cancelled' &&
      needs.design-system.result != 'failure' &&
      needs.design-system.result != 'cancelled' &&
      needs.tasks.result != 'failure' &&
      needs.tasks.result != 'cancelled' &&
      needs.backend.result != 'failure' &&
      needs.backend.result != 'cancelled'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-workspace.yml
    secrets: inherit
    with:
      workspace: frontend
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}
