name: 'PR'

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # scan:
  #   name: Scan
  #   permissions:
  #     actions: read
  #     contents: read
  #     security-events: write
  #   uses: ./.github/workflows/scan.yml

  pull-request:
    name: 'PR #${{ github.event.pull_request.number }} (branch: ${{ github.head_ref }})'
    # needs: scan
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      environment: pr
