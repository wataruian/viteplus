name: 'PR Pipeline'

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pull-request:
    name: 'PR #${{ github.event.pull_request.number }} (branch: ${{ github.head_ref }})'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/check.yml
    with:
      environment: pr
