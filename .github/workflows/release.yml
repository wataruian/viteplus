name: 'Release'

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Explicit version (only used when release is "custom")'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: [self-hosted, dagger]
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          version: 0.3.1
          run-install: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve release version
        id: resolve
        env:
          RELEASE_TYPE: ${{ inputs.release }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          if [ "${RELEASE_TYPE}" = "custom" ]; then
            version="${CUSTOM_VERSION}"
            if [ -z "$version" ]; then
              echo "::error::custom_version is required when release is 'custom'"
              exit 1
            fi
          else
            version="${RELEASE_TYPE}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Bump version (lockstep across all workspaces)
        run: |
          vp exec bumpp \
            package.json \
            apps/backend/package.json \
            apps/frontend/package.json \
            packages/common/package.json \
            packages/design-system/package.json \
            packages/library/package.json \
            --release "${{ steps.resolve.outputs.version }}" \
            --yes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release create "${tag}" --generate-notes

  deploy:
    name: Deploy
    needs: release
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/main.yml
