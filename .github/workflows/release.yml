name: 'Release'

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Explicit version (only used when release is "custom")'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: [self-hosted, linux, arm64, dagger]
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-mise: 'false'

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve release version
        id: resolve
        env:
          RELEASE_TYPE: ${{ inputs.release }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          if [ "${RELEASE_TYPE}" = "custom" ]; then
            version="${CUSTOM_VERSION}"
            if [ -z "$version" ]; then
              echo "::error::custom_version is required when release is 'custom'"
              exit 1
            fi
            semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
            if ! [[ "$version" =~ $semver ]]; then
              echo "::error::custom_version must be a semver version (e.g. 1.2.3 or 1.2.3-rc.1)"
              exit 1
            fi
          else
            version="${RELEASE_TYPE}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Bump version (lockstep across all workspaces)
        env:
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          vp exec bumpp \
            package.json \
            templates/backend/package.json \
            templates/frontend/package.json \
            templates/tasks/package.json \
            packages/common/package.json \
            templates/datastore/package.json \
            packages/design-system/package.json \
            templates/library/package.json \
            --release "${RELEASE_VERSION}" \
            --yes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release create "${tag}" --generate-notes

          {
            echo "### Released ${tag}"
            echo ""
            echo "This release is being deployed to **develop** automatically."
            echo "To promote it to staging or production, run the [Trigger workflow](../../actions/workflows/trigger.yml) with \`version: ${tag}\`."
          } >> "${GITHUB_STEP_SUMMARY}"

  develop:
    name: Develop
    needs: release
    concurrency:
      group: deploy-develop
      cancel-in-progress: true
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: develop
