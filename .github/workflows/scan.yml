name: 'Scan'

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_call:

jobs:
  scan-commit:
    name: Scan Commit
    runs-on: [ubuntu-latest]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Lint commits
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -n "${BASE_SHA}" && -n "${HEAD_SHA}" ]]; then
            mise run commitlint --from "${BASE_SHA}" --to "${HEAD_SHA}"
          else
            mise run commitlint
          fi

      - name: Scan for secrets
        shell: bash
        run: mise run secret-scan

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: [ubuntu-latest]
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/configs/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.0
        with:
          category: '/language:${{ matrix.language }}'
          # Set `upload: never` when GitHub Advanced Security is not enabled, otherwise remove it.
          # upload: never
