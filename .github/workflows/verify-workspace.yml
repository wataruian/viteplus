name: 'Verify Workspace'

on:
  workflow_call:
    inputs:
      workspace:
        description: 'Workspace'
        required: true
        type: string
      workspace-id:
        description: 'Dagger workspace identifier (defaults to @lightproject/<workspace>)'
        required: false
        type: string
        default: ''

jobs:
  verify:
    name: Verify ${{ inputs.workspace }}
    runs-on: [self-hosted, linux, arm64, dagger]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://dagger-engine
      WORKSPACE: ${{ inputs.workspace }}
      WORKSPACE_ID: ${{ inputs.workspace-id || format('@lightproject/{0}', inputs.workspace) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-vp: 'false'

      - name: Set up Dagger
        uses: ./.github/actions/setup-dagger

      - name: Check
        shell: bash
        run: mise run dagger check --workspace="${WORKSPACE_ID}" --export

      - name: Format
        shell: bash
        run: mise run dagger format --workspace="${WORKSPACE_ID}" --export

      - name: Lint
        shell: bash
        run: mise run dagger lint --workspace="${WORKSPACE_ID}" --export

      - name: Type Check
        shell: bash
        run: mise run dagger type-check --workspace="${WORKSPACE_ID}" --export

      - name: Build
        if: inputs.workspace != 'dagger'
        shell: bash
        run: |
          mise run dagger build-artifact \
            --workspace="${WORKSPACE_ID}" \
            --export="./tmp/artifacts/${WORKSPACE}/build" \
            --no-output

      - name: Test (unit)
        shell: bash
        run: mise run dagger test-unit --workspace="${WORKSPACE_ID}" --export

      - name: Upload coverage
        if: '!cancelled()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ inputs.workspace }}
          path: |
            tmp/artifacts/${{ inputs.workspace }}/coverage
            tmp/artifacts/${{ inputs.workspace }}/test-unit.row.md
          retention-days: 14
          if-no-files-found: ignore

      - name: Test (integration)
        if: hashFiles(format('*/{0}/tests/integration/**', inputs.workspace)) != ''
        shell: bash
        run: mise run dagger test-integration --workspace="${WORKSPACE_ID}" --export

      - name: Test (e2e)
        if: hashFiles(format('*/{0}/playwright.config.ts', inputs.workspace)) != ''
        shell: bash
        run: mise run dagger test-end-to-end --workspace="${WORKSPACE_ID}" --export

      - name: Upload e2e report and videos
        if: "!cancelled() && hashFiles(format('*/{0}/playwright.config.ts', inputs.workspace)) != ''"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ inputs.workspace }}
          path: |
            tmp/artifacts/${{ inputs.workspace }}/e2e-test-results
            tmp/artifacts/${{ inputs.workspace }}/test-end-to-end.row.md
          retention-days: 14
          if-no-files-found: ignore

      - name: Semgrep
        shell: bash
        run: mise run dagger semgrep --workspace="${WORKSPACE_ID}" --export

      - name: Upload Semgrep report
        if: '!cancelled()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-${{ inputs.workspace }}
          path: |
            tmp/artifacts/${{ inputs.workspace }}/semgrep.sarif
            tmp/artifacts/${{ inputs.workspace }}/semgrep.row.md
          retention-days: 14
          if-no-files-found: ignore
