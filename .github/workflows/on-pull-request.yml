name: 'Pull Request'

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/scan.yml

  pull-request:
    name: 'PR #${{ github.event.pull_request.number }} (branch: ${{ github.head_ref }})'
    needs: scan
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/verify.yml
    secrets: inherit
    with:
      environment: pr
