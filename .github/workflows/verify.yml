name: 'Verify'

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment'
        required: false
        type: string
      workspace:
        description: 'Workspace'
        required: false
        type: string

jobs:
  setup:
    name: Setup
    runs-on: [self-hosted, dagger]
    timeout-minutes: 5
    outputs:
      workspaces: ${{ steps.workspaces.outputs.workspaces }}
      workspace_list: ${{ steps.workspaces.outputs.workspace_list }}
      run-dagger-verify: ${{ steps.workspaces.outputs.run-dagger-verify }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-mise: 'false'

      - name: Resolve workspaces
        id: workspaces
        uses: ./.github/actions/resolve-workspaces
        with:
          workspace-input: ${{ inputs.workspace }}
          all-workspaces: 'design-system frontend backend common library'

  dagger:
    needs: setup
    if: >-
      !cancelled() &&
      needs.setup.result == 'success' &&
      needs.setup.outputs.run-dagger-verify == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/verify-workspace.yml
    secrets: inherit
    with:
      workspace: dagger
      workspace-id: dagger
      environment: ${{ inputs.environment }}

  library:
    needs: [setup, dagger]
    if: >-
      !cancelled() &&
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'library') &&
      needs.dagger.result != 'failure' &&
      needs.dagger.result != 'cancelled'
    permissions:
      contents: read
    uses: ./.github/workflows/verify-workspace.yml
    secrets: inherit
    with:
      workspace: library
      environment: ${{ inputs.environment }}

  common:
    needs: [setup, dagger]
    if: >-
      !cancelled() &&
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'common') &&
      needs.dagger.result != 'failure' &&
      needs.dagger.result != 'cancelled'
    permissions:
      contents: read
    uses: ./.github/workflows/verify-workspace.yml
    secrets: inherit
    with:
      workspace: common
      environment: ${{ inputs.environment }}

  design-system:
    needs: [setup, dagger]
    if: >-
      !cancelled() &&
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'design-system') &&
      needs.dagger.result != 'failure' &&
      needs.dagger.result != 'cancelled'
    permissions:
      contents: read
    uses: ./.github/workflows/verify-workspace.yml
    secrets: inherit
    with:
      workspace: design-system
      environment: ${{ inputs.environment }}

  backend:
    needs: [setup, dagger, common]
    if: >-
      !cancelled() &&
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'backend') &&
      needs.dagger.result != 'failure' &&
      needs.dagger.result != 'cancelled' &&
      needs.common.result != 'failure' &&
      needs.common.result != 'cancelled'
    permissions:
      contents: read
    uses: ./.github/workflows/verify-workspace.yml
    secrets: inherit
    with:
      workspace: backend
      environment: ${{ inputs.environment }}

  frontend:
    needs: [setup, dagger, common, design-system, backend]
    if: >-
      !cancelled() &&
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'frontend') &&
      needs.dagger.result != 'failure' &&
      needs.dagger.result != 'cancelled' &&
      needs.common.result != 'failure' &&
      needs.common.result != 'cancelled' &&
      needs.design-system.result != 'failure' &&
      needs.design-system.result != 'cancelled' &&
      needs.backend.result != 'failure' &&
      needs.backend.result != 'cancelled'
    permissions:
      contents: read
    uses: ./.github/workflows/verify-workspace.yml
    secrets: inherit
    with:
      workspace: frontend
      environment: ${{ inputs.environment }}

