name: 'Verify'

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment'
        required: false
        type: string
      workspace:
        description: 'Workspace'
        required: false
        type: string

jobs:
  setup:
    name: Setup
    runs-on: [self-hosted, dagger]
    timeout-minutes: 5
    outputs:
      workspaces: ${{ steps.workspaces.outputs.workspaces }}
      workspace_list: ${{ steps.workspaces.outputs.workspace_list }}
      run-dagger-verify: ${{ steps.workspaces.outputs.run-dagger-verify }}
      e2e_workspace_list: ${{ steps.e2e.outputs.workspace_list }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-mise: 'false'

      - name: Resolve workspaces
        id: workspaces
        uses: ./.github/actions/resolve-workspaces
        with:
          workspace-input: ${{ inputs.workspace }}
          all-workspaces: 'design-system frontend backend common library'

      - name: Resolve workspaces with e2e tests
        id: e2e
        shell: bash
        env:
          WORKSPACES: ${{ steps.workspaces.outputs.workspace_list }}
        run: |
          list=()
          for workspace in ${WORKSPACES}; do
            if compgen -G "*/${workspace}/playwright.config.ts" > /dev/null; then
              list+=("${workspace}")
            fi
          done
          echo "workspace_list=${list[*]}" >> "${GITHUB_OUTPUT}"

  dagger:
    needs: setup
    if: >-
      !cancelled() &&
      needs.setup.result == 'success' &&
      needs.setup.outputs.run-dagger-verify == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/verify-workspace.yml
    secrets: inherit
    with:
      workspace: dagger
      workspace-id: dagger
      environment: ${{ inputs.environment }}

  library:
    needs: [setup, dagger]
    if: >-
      !cancelled() &&
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'library') &&
      needs.dagger.result != 'failure' &&
      needs.dagger.result != 'cancelled'
    permissions:
      contents: read
    uses: ./.github/workflows/verify-workspace.yml
    secrets: inherit
    with:
      workspace: library
      environment: ${{ inputs.environment }}

  common:
    needs: [setup, dagger]
    if: >-
      !cancelled() &&
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'common') &&
      needs.dagger.result != 'failure' &&
      needs.dagger.result != 'cancelled'
    permissions:
      contents: read
    uses: ./.github/workflows/verify-workspace.yml
    secrets: inherit
    with:
      workspace: common
      environment: ${{ inputs.environment }}

  design-system:
    needs: [setup, dagger]
    if: >-
      !cancelled() &&
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'design-system') &&
      needs.dagger.result != 'failure' &&
      needs.dagger.result != 'cancelled'
    permissions:
      contents: read
    uses: ./.github/workflows/verify-workspace.yml
    secrets: inherit
    with:
      workspace: design-system
      environment: ${{ inputs.environment }}

  backend:
    needs: [setup, dagger, common]
    if: >-
      !cancelled() &&
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'backend') &&
      needs.dagger.result != 'failure' &&
      needs.dagger.result != 'cancelled' &&
      needs.common.result != 'failure' &&
      needs.common.result != 'cancelled'
    permissions:
      contents: read
    uses: ./.github/workflows/verify-workspace.yml
    secrets: inherit
    with:
      workspace: backend
      environment: ${{ inputs.environment }}

  frontend:
    needs: [setup, dagger, common, design-system, backend]
    if: >-
      !cancelled() &&
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'frontend') &&
      needs.dagger.result != 'failure' &&
      needs.dagger.result != 'cancelled' &&
      needs.common.result != 'failure' &&
      needs.common.result != 'cancelled' &&
      needs.design-system.result != 'failure' &&
      needs.design-system.result != 'cancelled' &&
      needs.backend.result != 'failure' &&
      needs.backend.result != 'cancelled'
    permissions:
      contents: read
    uses: ./.github/workflows/verify-workspace.yml
    secrets: inherit
    with:
      workspace: frontend
      environment: ${{ inputs.environment }}

  artifacts:
    name: Publish artifacts
    needs: [setup, common, design-system, library, backend, frontend, dagger]
    if: >-
      !cancelled() &&
      inputs.environment == 'pr' &&
      github.event_name == 'pull_request'
    runs-on: [self-hosted, dagger]
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download coverage artifacts and build table
        uses: ./.github/actions/download-artifact-table
        with:
          workspaces: ${{ needs.setup.outputs.workspace_list }}${{ needs.setup.outputs.run-dagger-verify == 'true' && ' dagger' || '' }}
          artifact-prefix: coverage
          row-file: test-unit.row.md
          header: |
            <!-- coverage-report -->
            ### Coverage report

            | Workspace | Lines | Statements | Functions | Branches |
            |---|---|---|---|---|
          fallback-suffix: '| _no coverage (tests failed or skipped)_ | | | |'
          body-file: coverage-body.md

      - name: Post or update PR comment
        uses: ./.github/actions/post-pr-comment
        with:
          marker: coverage-report
          body-file: coverage-body.md

      - name: Download e2e artifacts and build table
        if: needs.setup.outputs.e2e_workspace_list != ''
        uses: ./.github/actions/download-artifact-table
        with:
          workspaces: ${{ needs.setup.outputs.e2e_workspace_list }}
          artifact-prefix: e2e
          row-file: test-end-to-end.row.md
          header: |
            <!-- e2e-report -->
            ### E2E report

            Videos and HTML reports: [e2e-&lt;workspace&gt; artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)

            | Workspace | Result | Passed | Failed | Flaky | Skipped | Duration |
            |---|---|---|---|---|---|---|
          fallback-suffix: '| _no report (tests failed to start or were skipped)_ | | | | | |'
          body-file: e2e-body.md

      - name: Post or update e2e PR comment
        if: needs.setup.outputs.e2e_workspace_list != ''
        uses: ./.github/actions/post-pr-comment
        with:
          marker: e2e-report
          body-file: e2e-body.md

      - name: Download Semgrep artifacts and build table
        uses: ./.github/actions/download-artifact-table
        with:
          workspaces: ${{ needs.setup.outputs.workspace_list }}${{ needs.setup.outputs.run-dagger-verify == 'true' && ' dagger' || '' }}
          artifact-prefix: semgrep
          row-file: semgrep.row.md
          header: |
            <!-- semgrep-report -->
            ### Semgrep report

            | Workspace | Findings | Details |
            |---|---|---|
          fallback-suffix: '| _no report (scan failed or skipped)_ | |'
          body-file: semgrep-body.md

      - name: Post or update Semgrep PR comment
        uses: ./.github/actions/post-pr-comment
        with:
          marker: semgrep-report
          body-file: semgrep-body.md

      - name: Download SonarQube artifacts and build table
        uses: ./.github/actions/download-artifact-table
        with:
          workspaces: ${{ needs.setup.outputs.workspace_list }}${{ needs.setup.outputs.run-dagger-verify == 'true' && ' dagger' || '' }}
          artifact-prefix: sonar
          row-file: sonar.row.md
          header: |
            <!-- sonarqube-report -->
            ### SonarQube report

            | Workspace | Quality Gate | New Coverage | New Violations | Failed Conditions | Issues |
            |---|---|---|---|---|---|
          fallback-suffix: '| _no report (scan failed or skipped)_ | | | | |'
          body-file: sonar-body.md

      - name: Post or update SonarQube PR comment
        uses: ./.github/actions/post-pr-comment
        with:
          marker: sonarqube-report
          body-file: sonar-body.md
