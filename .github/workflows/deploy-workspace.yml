name: 'Deploy Workspace'

on:
  workflow_call:
    inputs:
      workspace:
        description: 'Workspace'
        required: true
        type: string
      environment:
        description: 'Environment'
        required: true
        type: string
      ref:
        description: 'Git tag/ref to deploy (defaults to the triggering ref, i.e. latest main)'
        required: false
        type: string

jobs:
  deploy:
    name: Deploy ${{ inputs.workspace }}
    runs-on: [self-hosted, linux, arm64, dagger]
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://dagger-engine
      WORKERS_SUBDOMAIN: wataru.workers.dev
      WORKER_SUFFIX: ${{ inputs.environment == 'develop' && 'dev' || inputs.environment }}
      ENVIRONMENT: ${{ inputs.environment }}
      WORKSPACE: ${{ inputs.workspace }}
      OTLP_ENDPOINT: ${{ vars.OTLP_ENDPOINT }}
      FARO_ENDPOINT: ${{ vars.FARO_ENDPOINT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Check the ref supports per-environment Workers
        shell: bash
        run: |
          case "${WORKSPACE}" in
            backend | frontend) configs=("apps/${WORKSPACE}/wrangler.toml") ;;
            design-system)
              configs=(
                "packages/design-system/wrangler.design-system.toml"
                "packages/design-system/wrangler.storybook.toml"
              )
              ;;
            *) configs=() ;;
          esac

          for config in "${configs[@]}"; do
            if ! grep -q "^\[env\.${ENVIRONMENT}\]" "${config}"; then
              echo "::error::${config} has no [env.${ENVIRONMENT}] block at this ref; it predates per-environment Workers and cannot be deployed by this pipeline."
              exit 1
            fi
          done

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-vp: 'false'

      - name: Set up Dagger
        uses: ./.github/actions/setup-dagger

      - name: Build and publish
        shell: bash
        env:
          REGISTRY_ADDRESS: ${{ vars.REGISTRY_ADDRESS }}
          VERSION_REF: ${{ inputs.ref }}
        run: |
          tag="${VERSION_REF:-$(git rev-parse --short=7 HEAD)}"

          BACKEND_URL="https://lightproject-backend-${WORKER_SUFFIX}.${WORKERS_SUBDOMAIN}"
          FRONTEND_URL="https://lightproject-frontend-${WORKER_SUFFIX}.${WORKERS_SUBDOMAIN}"

          args=()
          case "${WORKSPACE}" in
            design-system|frontend)
              args+=(
                "--build-env=VITE_ENV=${ENVIRONMENT}"
                "--build-env=VITE_BACKEND_URL=${BACKEND_URL}"
              )
              ;;
          esac

          if [[ "${WORKSPACE}" == "frontend" ]]; then
            args+=("--build-env=VITE_FRONTEND_URL=${FRONTEND_URL}")
          fi

          if [[ "${WORKSPACE}" == "frontend" && -n "${OTLP_ENDPOINT}" ]]; then
            args+=("--build-env=VITE_OTLP_ENDPOINT=${OTLP_ENDPOINT}")
          fi
          if [[ "${WORKSPACE}" == "frontend" && -n "${FARO_ENDPOINT}" ]]; then
            args+=("--build-env=VITE_FARO_ENDPOINT=${FARO_ENDPOINT}")
          fi

          mise run dagger publish \
            --workspace="@lightproject/${WORKSPACE}" \
            --address="${REGISTRY_ADDRESS}/${WORKSPACE}" \
            --tag="${tag}" \
            "${args[@]}"

      - name: Migrate
        if: inputs.workspace == 'database' && vars.DATABASE_MIGRATION_ENABLED == 'true'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          DATABASE_DIALECT: ${{ vars.DATABASE_DIALECT }}
        run: |
          args=()
          case "${DATABASE_DIALECT}" in
            '')
              echo "::error::DATABASE_MIGRATION_ENABLED is true but DATABASE_DIALECT is not set for ${ENVIRONMENT}."
              exit 1
              ;;
            d1)
              if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
                echo "::error::The d1 dialect needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets."
                exit 1
              fi
              args+=(
                --cloudflare-api-token=env:CLOUDFLARE_API_TOKEN
                --cloudflare-account-id=env:CLOUDFLARE_ACCOUNT_ID
              )
              ;;
            postgres)
              if [[ -z "${POSTGRES_URL}" ]]; then
                echo "::error::The postgres dialect needs the POSTGRES_URL secret for ${ENVIRONMENT}."
                exit 1
              fi
              args+=(--postgres-url=env:POSTGRES_URL)
              ;;
            *)
              echo "::error::DATABASE_DIALECT must be 'd1' or 'postgres', got '${DATABASE_DIALECT}'."
              exit 1
              ;;
          esac

          echo "Migrating: ${WORKSPACE} (${ENVIRONMENT}, ${DATABASE_DIALECT})"
          mise run dagger migrate \
            --workspace="@lightproject/${WORKSPACE}" \
            --environment="${ENVIRONMENT}" \
            --dialect="${DATABASE_DIALECT}" \
            "${args[@]}"

      - name: Deploy
        if: inputs.workspace != 'database'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Deploying: ${WORKSPACE} (${ENVIRONMENT})"

          BACKEND_URL="https://lightproject-backend-${WORKER_SUFFIX}.${WORKERS_SUBDOMAIN}"
          FRONTEND_URL="https://lightproject-frontend-${WORKER_SUFFIX}.${WORKERS_SUBDOMAIN}"

          args=()
          case "${WORKSPACE}" in
            design-system|frontend)
              args+=(
                "--build-env=VITE_ENV=${ENVIRONMENT}"
                "--build-env=VITE_BACKEND_URL=${BACKEND_URL}"
              )
              ;;
          esac

          if [[ "${WORKSPACE}" == "frontend" ]]; then
            args+=("--build-env=VITE_FRONTEND_URL=${FRONTEND_URL}")
          fi

          if [[ "${WORKSPACE}" == "frontend" && -n "${OTLP_ENDPOINT}" ]]; then
            args+=("--build-env=VITE_OTLP_ENDPOINT=${OTLP_ENDPOINT}")
          fi

          if [[ "${WORKSPACE}" == "frontend" && -n "${FARO_ENDPOINT}" ]]; then
            args+=("--build-env=VITE_FARO_ENDPOINT=${FARO_ENDPOINT}")
          fi

          if [[ "${WORKSPACE}" == "backend" && -n "${OTLP_ENDPOINT}" ]]; then
            args+=("--worker-var=OTLP_ENDPOINT=${OTLP_ENDPOINT}")
          fi

          mise run dagger wrangler \
            --workspace="@lightproject/${WORKSPACE}" \
            --environment="${ENVIRONMENT}" \
            --cloudflare-api-token=env:CLOUDFLARE_API_TOKEN \
            --cloudflare-account-id=env:CLOUDFLARE_ACCOUNT_ID \
            "${args[@]}"

      - name: Smoke test
        if: inputs.workspace != 'database'
        shell: bash
        run: |
          case "${WORKSPACE}" in
            backend | frontend)
              urls=("https://lightproject-${WORKSPACE}-${WORKER_SUFFIX}.${WORKERS_SUBDOMAIN}")
              ;;
            design-system)
              urls=(
                "https://lightproject-design-system-${WORKER_SUFFIX}.${WORKERS_SUBDOMAIN}"
                "https://lightproject-storybook-${WORKER_SUFFIX}.${WORKERS_SUBDOMAIN}"
              )
              ;;
            *)
              echo "::warning::No health check URL configured for ${WORKSPACE}; skipping."
              exit 0
              ;;
          esac

          for url in "${urls[@]}"; do
            passed=false
            for attempt in 1 2 3 4 5; do
              status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${url}" || echo "000")"
              if [[ "${status}" == "200" ]]; then
                echo "Smoke test passed for ${url} (HTTP ${status})"
                passed=true
                break
              fi
              echo "Attempt ${attempt}/5 for ${url}: HTTP ${status}, retrying in 5s..."
              sleep 5
            done

            if [[ "${passed}" != true ]]; then
              echo "::error::Smoke test failed for ${url}"
              exit 1
            fi
          done
