name: 'Deploy Workspace'

on:
  workflow_call:
    inputs:
      workspace:
        description: 'Workspace'
        required: true
        type: string
      environment:
        description: 'Environment'
        required: true
        type: string
      ref:
        description: 'Git tag/ref to deploy (defaults to the triggering ref, i.e. latest main)'
        required: false
        type: string

jobs:
  deploy:
    name: ${{ inputs.workspace }}
    runs-on: [self-hosted, dagger]
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
