name: 'Commit Lint'

on:
  pull_request:
    branches: [main]

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit Lint
    runs-on: [self-hosted, dagger]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Mise
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.7.3

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          version: 0.3.1
          run-install: true

      - name: Lint commits
        shell: bash
        run: mise run commitlint "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
