name: 'Main Pipeline'

on:
  push:
    branches: [main, ci]

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  develop:
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/check.yml
    with:
      environment: develop
    secrets: inherit

