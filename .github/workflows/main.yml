name: 'Main'

on:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: main
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/validate.yml

  develop:
    name: 'Develop'
    needs: validate
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      environment: develop

  staging:
    name: 'Staging'
    needs: develop
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      environment: staging

  production:
    name: 'Production'
    needs: staging
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      environment: production
