name: 'CI'

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment'
        required: false
        type: string
      workspace:
        description: 'Workspace'
        required: false
        type: string

jobs:
  setup:
    name: Setup
    runs-on: [self-hosted, dagger]
    timeout-minutes: 5
    outputs:
      workspaces: ${{ steps.workspaces.outputs.workspaces }}
      workspace_list: ${{ steps.workspaces.outputs.workspace_list }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Mise
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.7.3

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          version: 0.3.1
          run-install: true

      - name: Resolve workspaces
        id: workspaces
        shell: bash
        env:
          WORKSPACE_INPUT: ${{ inputs.workspace }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          all="design-system frontend backend common library"

          if [[ -n "${WORKSPACE_INPUT}" ]]; then
            list="${WORKSPACE_INPUT}"
          elif [[ "${EVENT_NAME}" == "pull_request" && -n "${BASE_SHA}" ]]; then
            changedFiles="$(git diff --name-only "${BASE_SHA}...HEAD")"

            if [[ -z "${changedFiles}" ]] || grep -qvE '^(apps|packages)/' <<< "${changedFiles}"; then
              list="${all}"
            else
              affected="$(vp pm list -r --json --only-projects --filter "...[${BASE_SHA}]" | jq -r '.[].name')"
              list=""
              for workspace in ${all}; do
                if grep -qx "@lightproject/${workspace}" <<< "${affected}"; then
                  list+="${workspace} "
                fi
              done
              list="${list% }"
            fi
          else
            list="${all}"
          fi

          json="["
          for workspace in ${list}; do
            json+="\"${workspace}\","
          done
          json="${json%,}]"

          echo "::group::Resolved workspaces"
          echo "base sha: ${BASE_SHA}"
          echo "changed files:"
          echo "${changedFiles:-<none>}"
          echo "affected (vp pm list):"
          echo "${affected:-<none>}"
          echo "resolved list: ${list}"
          echo "workspaces json: ${json}"
          echo "::endgroup::"

          echo "workspaces=${json}" >> "${GITHUB_OUTPUT}"
          echo "workspace_list=${list}" >> "${GITHUB_OUTPUT}"

  # Dependency graph (mirrors `vp pm list -r --json --only-projects`):
  #   common, design-system, library -> no internal deps
  #   backend                        -> common
  #   frontend                       -> common, design-system, backend
  #
  # Each job only runs if its workspace is in the affected list (`setup` output).
  # The `if:` on a dependent job explicitly ignores upstream `skipped` results
  # (a dependency wasn't affected, so nothing to fail) but blocks on real
  # `failure`/`cancelled` results, since GitHub's default `needs:` condition
  # (`success()`) would otherwise treat "skipped" the same as "failed" and
  # skip the dependent job even when it IS affected.

  library:
    needs: setup
    if: >-
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'library')
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    secrets: inherit
    with:
      workspace: library
      environment: ${{ inputs.environment }}

  common:
    needs: setup
    if: >-
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'common')
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    secrets: inherit
    with:
      workspace: common
      environment: ${{ inputs.environment }}

  design-system:
    needs: setup
    if: >-
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'design-system')
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    secrets: inherit
    with:
      workspace: design-system
      environment: ${{ inputs.environment }}

  backend:
    needs: [setup, common]
    if: >-
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'backend') &&
      needs.common.result != 'failure' &&
      needs.common.result != 'cancelled'
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    secrets: inherit
    with:
      workspace: backend
      environment: ${{ inputs.environment }}

  frontend:
    needs: [setup, common, design-system, backend]
    if: >-
      needs.setup.result == 'success' &&
      contains(fromJson(needs.setup.outputs.workspaces), 'frontend') &&
      needs.common.result != 'failure' &&
      needs.common.result != 'cancelled' &&
      needs.design-system.result != 'failure' &&
      needs.design-system.result != 'cancelled' &&
      needs.backend.result != 'failure' &&
      needs.backend.result != 'cancelled'
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    secrets: inherit
    with:
      workspace: frontend
      environment: ${{ inputs.environment }}

  artifacts:
    name: Publish artifacts
    needs: [setup, common, design-system, library, backend, frontend]
    if: always() && inputs.environment == 'pr' && github.event_name == 'pull_request'
    runs-on: [self-hosted, dagger]
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download coverage artifacts and build table
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKSPACES: ${{ needs.setup.outputs.workspace_list }}
        run: |
          {
            echo '<!-- coverage-report -->'
            echo '### Coverage report'
            echo ''
            echo '| Workspace | Lines | Statements | Functions | Branches |'
            echo '|---|---|---|---|---|'
            for workspace in ${WORKSPACES}; do
              dest="coverage-artifacts/${workspace}"
              gh run download "${{ github.run_id }}" --name "coverage-${workspace}" --dir "${dest}" || echo "no artifact for ${workspace}, skipping" >&2

              summary="${dest}/coverage-summary.json"
              if [[ -f "${summary}" ]]; then
                lines="$(jq -r '.total.lines.pct' "${summary}")"
                statements="$(jq -r '.total.statements.pct' "${summary}")"
                functions="$(jq -r '.total.functions.pct' "${summary}")"
                branches="$(jq -r '.total.branches.pct' "${summary}")"
                echo "| ${workspace} | ${lines}% | ${statements}% | ${functions}% | ${branches}% |"
              else
                echo "| ${workspace} | _no coverage (tests failed or skipped)_ | | | |"
              fi
            done
          } > body.md
          cat body.md

      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_id="$(
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              --paginate \
              --jq '.[] | select(.body | startswith("<!-- coverage-report -->")) | .id' \
              | head -1
          )"

          if [[ -n "${existing_id}" ]]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${existing_id}" -F body=@body.md
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -F body=@body.md
          fi

      - name: Download Semgrep artifacts and build table
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKSPACES: ${{ needs.setup.outputs.workspace_list }}
        run: |
          {
            echo '<!-- semgrep-report -->'
            echo '### Semgrep report'
            echo ''
            echo '| Workspace | Findings | Details |'
            echo '|---|---|---|'
            for workspace in ${WORKSPACES}; do
              dest="semgrep-artifacts/${workspace}"
              gh run download "${{ github.run_id }}" --name "semgrep-${workspace}" --dir "${dest}" || echo "no artifact for ${workspace}, skipping" >&2

              sarif="${dest}/semgrep.sarif"
              if [[ -f "${sarif}" ]]; then
                count="$(jq '[.runs[0].results[]?] | length' "${sarif}")"
                details="$(
                  jq -r '
                    [.runs[0].results[]?
                      | ( .locations[0].physicalLocation.artifactLocation.uri // "?" ) as $file
                      | ( .locations[0].physicalLocation.region.startLine // "?" ) as $line
                      | ( (.message.text // "") | gsub("\n"; " ") | gsub("\\|"; " ") ) as $msg
                      | "`\(.ruleId)` \($file):\($line) — \($msg)"
                    ] as $all
                    | ($all[0:10] + (if ($all | length) > 10 then ["… +\(($all | length) - 10) more"] else [] end))
                    | if length == 0 then "-" else join("<br>---<br>") end
                  ' "${sarif}"
                )"
                echo "| ${workspace} | ${count} | ${details} |"
              else
                echo "| ${workspace} | _no report (scan failed or skipped)_ | |"
              fi
            done
          } > semgrep-body.md
          cat semgrep-body.md

      - name: Post or update Semgrep PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_id="$(
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              --paginate \
              --jq '.[] | select(.body | startswith("<!-- semgrep-report -->")) | .id' \
              | head -1
          )"

          if [[ -n "${existing_id}" ]]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${existing_id}" -F body=@semgrep-body.md
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -F body=@semgrep-body.md
          fi

      - name: Download SonarQube artifacts and build table
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKSPACES: ${{ needs.setup.outputs.workspace_list }}
        run: |
          {
            echo '<!-- sonarqube-report -->'
            echo '### SonarQube report'
            echo ''
            echo '| Workspace | Quality Gate | New Coverage | New Violations | Failed Conditions | Issues |'
            echo '|---|---|---|---|---|---|'
            for workspace in ${WORKSPACES}; do
              dest="sonar-artifacts/${workspace}"
              gh run download "${{ github.run_id }}" --name "sonar-${workspace}" --dir "${dest}" || echo "no artifact for ${workspace}, skipping" >&2

              gate_file="${dest}/sonar-quality-gate.json"
              issues_file="${dest}/sonar-issues.json"
              if [[ -f "${gate_file}" ]]; then
                status="$(jq -r '.projectStatus.status // "UNKNOWN"' "${gate_file}")"
                new_coverage="$(jq -r '[.projectStatus.conditions[]? | select(.metricKey == "new_coverage") | .actualValue] | first // "-"' "${gate_file}")"
                new_violations="$(jq -r '[.projectStatus.conditions[]? | select(.metricKey == "new_violations") | .actualValue] | first // "-"' "${gate_file}")"
                if [[ "${status}" == "OK" ]]; then
                  gate_display="✅ Passed"
                  failed_conditions="-"
                else
                  gate_display="❌ ${status}"
                  failed_conditions="$(
                    jq -r '
                      { GT: ">", LT: "<", EQ: "==", NE: "!=" } as $ops
                      | [.projectStatus.conditions[]? | select(.status != "OK")
                          | "`\(.metricKey)` \(.actualValue) \($ops[.comparator] // .comparator) \(.errorThreshold)"]
                      | if length == 0 then "-" else join("<br>---<br>") end
                    ' "${gate_file}"
                  )"
                fi

                issues="-"
                if [[ -f "${issues_file}" ]]; then
                  issues="$(
                    jq -r '
                      [.issues[]?
                        | ( .component // "" | sub("^[^:]*:"; "") ) as $file
                        | ( .line // "?" ) as $line
                        | ( (.message // "") | gsub("\n"; " ") | gsub("\\|"; " ") ) as $msg
                        | "`\(.rule)` \($file):\($line) — \($msg)"
                      ] as $all
                      | ($all[0:10] + (if ($all | length) > 10 then ["… +\(($all | length) - 10) more"] else [] end))
                      | if length == 0 then "-" else join("<br>---<br>") end
                    ' "${issues_file}"
                  )"
                fi

                echo "| ${workspace} | ${gate_display} | ${new_coverage} | ${new_violations} | ${failed_conditions} | ${issues} |"
              else
                echo "| ${workspace} | _no report (scan failed or skipped)_ | | | | |"
              fi
            done
          } > sonar-body.md
          cat sonar-body.md

      - name: Post or update SonarQube PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_id="$(
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              --paginate \
              --jq '.[] | select(.body | startswith("<!-- sonarqube-report -->")) | .id' \
              | head -1
          )"

          if [[ -n "${existing_id}" ]]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${existing_id}" -F body=@sonar-body.md
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -F body=@sonar-body.md
          fi
