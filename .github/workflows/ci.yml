name: 'CI'

on:
  push:
    branches: [main, staging, develop]
  pull_request:

jobs:
  ready:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Mise
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.7.3

      # - name: Set up Vite+
      #   uses: voidzero-dev/setup-vp@v1.19.0
      #   with:
      #     version: 0.3.0
      #     cache: true
      #     run-install: true

      - name: Setup configs
        id: setup-configs
        run: |
          echo "mise version:"
          mise_version="$(mise --version 2>/dev/null | head -n1 | awk '{print $1}')"
          echo "${mise_version}"
          echo " "

          echo "node version:"
          node --version
          echo " "

          echo "pnpm version:"
          pnpm --version
          echo " "

          # echo "vp version:"
          # vp --version
          # echo " "

          dagger_version="$(dagger version | awk '{print $2}' | sed 's/^//')"
          echo "dagger_version=${dagger_version}" >> "${GITHUB_OUTPUT}"
          echo "dagger version:"
          echo "${dagger_version}"

      - name: Cache Dagger SDK
        id: cache-dagger-sdk
        uses: actions/cache@v6.1.0
        with:
          path: .dagger/sdk
          key: dagger-sdk-${{ runner.os }}-${{ steps.setup-configs.outputs.dagger_version }}-${{ hashFiles('dagger.json', '.dagger/src/index.ts', '.dagger/package.json', '.dagger/pnpm-lock.yaml', '.dagger/tsconfig.json') }}

      - name: Restore Dagger engine volume cache
        id: restore-dagger-engine-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: dagger-engine-cache.tar.gz
          key: dagger-engine-volume-${{ runner.os }}-${{ steps.setup-configs.outputs.dagger_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dagger-engine-volume-${{ runner.os }}-${{ steps.setup-configs.outputs.dagger_version }}-

      - name: Start Dagger engine
        run: |
          docker volume create dagger-engine-cache
          if [[ -f dagger-engine-cache.tar.gz ]]; then
            docker run --rm -v dagger-engine-cache:/data -v "${PWD}":/backup alpine \
              sh -c "tar xzf /backup/dagger-engine-cache.tar.gz -C /data"
          fi

          echo '{"gc": {"enabled": false}}' > dagger-engine.json

          docker run -d --privileged \
            --name dagger-engine-custom \
            -v dagger-engine-cache:/var/lib/dagger \
            -v "${PWD}/dagger-engine.json":/etc/dagger/engine.json \
            "registry.dagger.io/engine:${{ steps.setup-configs.outputs.dagger_version }}"

          echo "_EXPERIMENTAL_DAGGER_RUNNER_HOST=container://dagger-engine-custom" >> "${GITHUB_ENV}"

      - name: Diagnose Dagger engine startup
        run: |
          sleep 3
          echo "--- docker ps -a ---"
          docker ps -a
          echo "--- docker logs dagger-engine-custom ---"
          docker logs dagger-engine-custom || true
          echo "--- docker inspect mounts ---"
          docker inspect dagger-engine-custom --format '{{json .Mounts}}' || true

      - name: Setup Dagger
        if: steps.cache-dagger-sdk.outputs.cache-hit != 'true'
        run: dagger develop

      # - name: Run Vite+ pipeline
      #   run: vp run -r root

      # - name: Run Vite+ pipeline
      #   run: vp run ready

      - name: Run Dagger pipeline
        uses: dagger/dagger-for-github@v8.4.1
        env:
          DAGGER_NO_NAG: 1
        with:
          check: '**'
          version: ${{ steps.setup-configs.outputs.dagger_version }}
          # call: ready
          call: check --workspace=@lightproject/library

      - name: Diagnose Dagger engine after run
        if: always()
        run: |
          echo "--- docker ps -a (checking for a second, dagger-auto-provisioned container) ---"
          docker ps -a
          echo "--- docker logs dagger-engine-custom (tail) ---"
          docker logs --tail 200 dagger-engine-custom || true
          echo "--- actual volume content size (independent of the tar step) ---"
          docker run --rm -v dagger-engine-cache:/data alpine du -sh /data || true

      - name: Stop Dagger engine
        if: always()
        run: docker stop dagger-engine-custom 2>/dev/null || true

      - name: Diagnose volume size after stop
        if: always()
        run: docker run --rm -v dagger-engine-cache:/data alpine du -sh /data || true

      - name: Save Dagger engine volume
        if: always()
        run: |
          docker run --rm -v dagger-engine-cache:/data -v "${PWD}":/backup alpine \
            sh -c "tar czf /backup/dagger-engine-cache.tar.gz -C /data ."

      - name: Save Dagger engine volume cache
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: dagger-engine-cache.tar.gz
          key: dagger-engine-volume-${{ runner.os }}-${{ steps.setup-configs.outputs.dagger_version }}-${{ github.run_id }}-${{ github.run_attempt }}
