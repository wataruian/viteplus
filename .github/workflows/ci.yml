name: 'CI'

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ready:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@v4
      # - name: Set up Vite+
      #   uses: voidzero-dev/setup-vp@v1
      #   with:
      #     cache: true
      #     run-install: true
      # - name: Run checks, build, and tests
      #   run: vp run ready
      - name: Run Dagger pipeline
        uses: dagger/dagger-for-github@v8
        with:
          version: '0.21.9'
          call: ready
          # cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
