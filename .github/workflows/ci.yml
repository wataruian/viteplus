name: 'CI'

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment'
        required: false
        type: string
      workspace:
        description: 'Workspace'
        required: false
        type: string

jobs:
  setup:
    name: Setup
    runs-on: [self-hosted, dagger]
    timeout-minutes: 5
    outputs:
      workspaces: ${{ steps.workspaces.outputs.workspaces }}
      workspace_list: ${{ steps.workspaces.outputs.workspace_list }}
    steps:
      - name: Resolve workspaces
        id: workspaces
        shell: bash
        env:
          WORKSPACE_INPUT: ${{ inputs.workspace }}
        run: |
          if [[ -n "${WORKSPACE_INPUT}" ]]; then
            list="${WORKSPACE_INPUT}"
          else
            list="design-system frontend backend"
          fi

          json="["
          for workspace in ${list}; do
            json+="\"${workspace}\","
          done
          json="${json%,}]"

          echo "workspaces=${json}" >> "${GITHUB_OUTPUT}"
          echo "workspace_list=${list}" >> "${GITHUB_OUTPUT}"

  ci:
    name: ${{ matrix.workspace }}
    needs: setup
    runs-on: [self-hosted, dagger]
    timeout-minutes: 30
    environment: ${{ inputs.environment || null }}
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://dagger-engine
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJson(needs.setup.outputs.workspaces) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Mise
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.7.3

      - name: Setup configs
        shell: bash
        run: |
          echo "DAGGER_NO_NAG=1" >> "${GITHUB_ENV}"

      - name: Setup Dagger
        shell: bash
        run: dagger develop

      - name: Check
        shell: bash
        run: mise run dagger-artifact check "@lightproject/${{ matrix.workspace }}"

      - name: Format
        shell: bash
        run: mise run dagger-artifact format "@lightproject/${{ matrix.workspace }}"

      - name: Lint
        shell: bash
        run: mise run dagger-artifact lint "@lightproject/${{ matrix.workspace }}"

      - name: Type Check
        shell: bash
        run: mise run dagger-artifact type-check "@lightproject/${{ matrix.workspace }}"

      - name: Build
        shell: bash
        env:
          REGISTRY_ADDRESS: ${{ vars.REGISTRY_ADDRESS }}
          ENVIRONMENT: ${{ inputs.environment }}
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          if [[ -n "${ENVIRONMENT}" && "${ENVIRONMENT}" != "pr" ]]; then
            mise run publish "@lightproject/${WORKSPACE}" "${REGISTRY_ADDRESS}/${WORKSPACE}" "${GITHUB_SHA::7}"
          else
            mise run dagger-artifact build "@lightproject/${WORKSPACE}"
          fi

      - name: Test
        shell: bash
        run: mise run dagger-artifact test "@lightproject/${{ matrix.workspace }}"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ matrix.workspace }}
          path: tmp/artifacts/${{ matrix.workspace }}/coverage
          retention-days: 14

      - name: Semgrep
        shell: bash
        run: mise run dagger-artifact semgrep "@lightproject/${{ matrix.workspace }}"

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: semgrep-${{ matrix.workspace }}
          path: tmp/artifacts/${{ matrix.workspace }}/semgrep.sarif
          retention-days: 14
          if-no-files-found: ignore

      - name: SonarQube
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mise run dagger-artifact sonar "@lightproject/${{ matrix.workspace }}"

      - name: Upload SonarQube report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sonar-${{ matrix.workspace }}
          path: |
            tmp/artifacts/${{ matrix.workspace }}/sonar-quality-gate.json
            tmp/artifacts/${{ matrix.workspace }}/sonar-issues.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Deploy
        if: inputs.environment != '' && inputs.environment != 'pr'
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          echo "Deploying: ${WORKSPACE} (${ENVIRONMENT})"
          echo "✅ All good!"

  artifacts:
    name: Publish artifacts
    needs: [setup, ci]
    if: always() && inputs.environment == 'pr' && github.event_name == 'pull_request'
    runs-on: [self-hosted, dagger]
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download coverage artifacts and build table
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKSPACES: ${{ needs.setup.outputs.workspace_list }}
        run: |
          {
            echo '<!-- coverage-report -->'
            echo '### Coverage report'
            echo ''
            echo '| Workspace | Lines | Statements | Functions | Branches |'
            echo '|---|---|---|---|---|'
            for workspace in ${WORKSPACES}; do
              dest="coverage-artifacts/${workspace}"
              gh run download "${{ github.run_id }}" --name "coverage-${workspace}" --dir "${dest}" || echo "no artifact for ${workspace}, skipping" >&2

              summary="${dest}/coverage-summary.json"
              if [[ -f "${summary}" ]]; then
                lines="$(jq -r '.total.lines.pct' "${summary}")"
                statements="$(jq -r '.total.statements.pct' "${summary}")"
                functions="$(jq -r '.total.functions.pct' "${summary}")"
                branches="$(jq -r '.total.branches.pct' "${summary}")"
                echo "| ${workspace} | ${lines}% | ${statements}% | ${functions}% | ${branches}% |"
              else
                echo "| ${workspace} | _no coverage (tests failed or skipped)_ | | | |"
              fi
            done
          } > body.md
          cat body.md

      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_id="$(
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              --paginate \
              --jq '.[] | select(.body | startswith("<!-- coverage-report -->")) | .id' \
              | head -1
          )"

          if [[ -n "${existing_id}" ]]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${existing_id}" -F body=@body.md
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -F body=@body.md
          fi

      - name: Download Semgrep artifacts and build table
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKSPACES: ${{ needs.setup.outputs.workspace_list }}
        run: |
          {
            echo '<!-- semgrep-report -->'
            echo '### Semgrep report'
            echo ''
            echo '| Workspace | Findings |'
            echo '|---|---|'
            for workspace in ${WORKSPACES}; do
              dest="semgrep-artifacts/${workspace}"
              gh run download "${{ github.run_id }}" --name "semgrep-${workspace}" --dir "${dest}" || echo "no artifact for ${workspace}, skipping" >&2

              sarif="${dest}/semgrep.sarif"
              if [[ -f "${sarif}" ]]; then
                count="$(jq '[.runs[0].results[]?] | length' "${sarif}")"
                echo "| ${workspace} | ${count} |"
              else
                echo "| ${workspace} | _no report (scan failed or skipped)_ |"
              fi
            done
          } > semgrep-body.md
          cat semgrep-body.md

      - name: Post or update Semgrep PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_id="$(
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              --paginate \
              --jq '.[] | select(.body | startswith("<!-- semgrep-report -->")) | .id' \
              | head -1
          )"

          if [[ -n "${existing_id}" ]]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${existing_id}" -F body=@semgrep-body.md
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -F body=@semgrep-body.md
          fi

      - name: Download SonarQube artifacts and build table
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKSPACES: ${{ needs.setup.outputs.workspace_list }}
        run: |
          {
            echo '<!-- sonarqube-report -->'
            echo '### SonarQube report'
            echo ''
            echo '| Workspace | Quality Gate | New Coverage | New Violations |'
            echo '|---|---|---|---|'
            for workspace in ${WORKSPACES}; do
              dest="sonar-artifacts/${workspace}"
              gh run download "${{ github.run_id }}" --name "sonar-${workspace}" --dir "${dest}" || echo "no artifact for ${workspace}, skipping" >&2

              gate_file="${dest}/sonar-quality-gate.json"
              if [[ -f "${gate_file}" ]]; then
                status="$(jq -r '.projectStatus.status // "UNKNOWN"' "${gate_file}")"
                new_coverage="$(jq -r '[.projectStatus.conditions[]? | select(.metricKey == "new_coverage") | .actualValue] | first // "-"' "${gate_file}")"
                new_violations="$(jq -r '[.projectStatus.conditions[]? | select(.metricKey == "new_violations") | .actualValue] | first // "-"' "${gate_file}")"
                if [[ "${status}" == "OK" ]]; then
                  gate_display="✅ Passed"
                else
                  gate_display="❌ ${status}"
                fi
                echo "| ${workspace} | ${gate_display} | ${new_coverage} | ${new_violations} |"
              else
                echo "| ${workspace} | _no report (scan failed or skipped)_ | | |"
              fi
            done
          } > sonar-body.md
          cat sonar-body.md

      - name: Post or update SonarQube PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_id="$(
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              --paginate \
              --jq '.[] | select(.body | startswith("<!-- sonarqube-report -->")) | .id' \
              | head -1
          )"

          if [[ -n "${existing_id}" ]]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${existing_id}" -F body=@sonar-body.md
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -F body=@sonar-body.md
          fi
