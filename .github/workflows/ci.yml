name: 'CI'

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ready:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          run-install: true
      - name: Run checks, build, and tests
        run: vp run ready
