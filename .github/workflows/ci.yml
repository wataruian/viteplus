name: 'CI'

on:
  push:
    branches: [develop, main]
jobs:
  develop:
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      actions: write
    uses: ./.github/actions/main
    with:
      environment: develop
    secrets: inherit

  staging:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: write
    uses: ./.github/actions/main
    with:
      environment: staging
    secrets: inherit

  production:
    needs: staging
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: write
    uses: ./.github/actions/main
    with:
      environment: production
    secrets: inherit
