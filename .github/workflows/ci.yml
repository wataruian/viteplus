name: 'CI'

on:
  push:
    branches: [develop, main]
jobs:
  # ready:
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #     actions: write
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v7.0.1

  #     - name: Base setup
  #       uses: ./.github/actions/base

  dev:
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/_workspace-checks.yml
    with:
      environment: dev
    secrets: inherit

  staging:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_workspace-checks.yml
    with:
      environment: staging
    secrets: inherit

  production:
    needs: staging
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_workspace-checks.yml
    with:
      environment: production
    secrets: inherit
