name: 'CI'

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ready:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Mise
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.7.3

      # - name: Set up Vite+
      #   uses: voidzero-dev/setup-vp@v1.19.0
      #   with:
      #     version: 0.3.0
      #     cache: true
      #     run-install: true

      - name: Resolve toolchain versions
        id: resolve-toolchain-versions
        run: |
          echo "node version:"
          node --version
          echo " "

          echo "pnpm version:"
          pnpm --version
          echo " "

          dagger_version="v$(dagger version | awk '{print $2}' | sed 's/^v//')"
          echo "dagger_version=${dagger_version}" >> "$GITHUB_OUTPUT"
          echo "dagger version:"
          echo "${dagger_version}"
          echo " "

          # echo "vp version:"
          # vp --version
          # echo " "

      - name: Setup Dagger
        run: dagger develop

      # - name: Run Vite+ pipeline
      #   run: vp run ready

      - uses: crazy-max/ghaction-github-runtime@v4.0.0

      - name: Build Dagger cache config
        id: dagger-cache-config
        run: |
          URL="${ACTIONS_RESULTS_URL:-$ACTIONS_CACHE_URL}"
          echo "::add-mask::${ACTIONS_RUNTIME_TOKEN}"
          echo "config=type=gha,mode=max,scope=dagger-${GITHUB_REF_NAME},url=${URL},token=${ACTIONS_RUNTIME_TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Run Dagger pipeline
        uses: dagger/dagger-for-github@v8.4.1
        env:
          DAGGER_NO_NAG: 1
          _EXPERIMENTAL_DAGGER_CACHE_CONFIG: ${{ steps.dagger-cache-config.outputs.config }}
        with:
          version: ${{ steps.resolve-toolchain-versions.outputs.dagger_version }}
          call: ready
          # cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
