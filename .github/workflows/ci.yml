name: 'CI'

on:
  push:
    branches: [develop, main]
jobs:
  develop:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/_main.yml
    with:
      environment: develop
    secrets: inherit

  staging:
    needs: develop
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/_main.yml
    with:
      environment: staging
    secrets: inherit

  production:
    needs: staging
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/_main.yml
    with:
      environment: production
    secrets: inherit
