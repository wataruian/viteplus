name: 'CI'

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ready:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.3
      # - name: Resolve dagger version from mise
      #   id: dagger-version
      #   run: echo "version=$(dagger version | awk '{print $2}' | sed 's/^v//')" >> "$GITHUB_OUTPUT"
      - name: Resolve toolchain versions
        run: |
          mise --version
          node --version
          pnpm --version
          dagger --version
