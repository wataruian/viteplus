name: 'CI'

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ready:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@v4
      # - name: Set up Vite+
      #   uses: voidzero-dev/setup-vp@v1
      #   with:
      #     cache: true
      #     run-install: true
      # - name: Run checks, build, and tests
      #   run: vp run ready
      # Exposes the GitHub Actions cache endpoint/token as env vars for the step below.
      # GitHub stopped auto-exposing these; this action re-derives them.
      - uses: crazy-max/ghaction-github-runtime@v4
      # NOTE: this is Dagger's *exec/layer* cache only - it never persists the contents
      # of our withMountedCache volumes (pnpm-store, task-cache, etc), since that's a
      # separate BuildKit mechanism that export/import cache backends don't cover. It
      # only helps when a run is byte-identical to a prior one (e.g. a rerun); it does
      # NOT speed up installs when source actually changes, which is the common case.
      # Real cross-run reuse of those cache volumes needs a persistent engine instead
      # (self-hosted, or Dagger Cloud).
      - name: Build Dagger cache config
        id: dagger-cache-config
        run: |
          URL="${ACTIONS_RESULTS_URL:-$ACTIONS_CACHE_URL}"
          echo "::add-mask::${ACTIONS_RUNTIME_TOKEN}"
          echo "config=type=gha,mode=max,scope=dagger-${GITHUB_REF_NAME},url=${URL},token=${ACTIONS_RUNTIME_TOKEN}" >> "$GITHUB_OUTPUT"
      - name: Run Dagger pipeline
        uses: dagger/dagger-for-github@v8
        env:
          _EXPERIMENTAL_DAGGER_CACHE_CONFIG: ${{ steps.dagger-cache-config.outputs.config }}
        with:
          version: '0.21.9'
          call: ready
          # cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
