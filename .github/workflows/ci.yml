name: 'CI'

on:
  push:
    branches: [main]

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  develop:
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/_main.yml
    with:
      environment: develop
      cacheScope: develop
    secrets: inherit

  staging:
    needs: develop
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/_main.yml
    with:
      environment: staging
      cacheScope: staging
    secrets: inherit

  production:
    needs: staging
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/_main.yml
    with:
      environment: production
      cacheScope: production
    secrets: inherit
