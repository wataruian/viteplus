name: 'Secret Scan'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: [self-hosted, dagger]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        run: |
          container_id="$(docker create ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source=/repo --redact --verbose)"
          docker cp . "${container_id}:/repo"
          docker start "${container_id}" >/dev/null
          docker logs -f "${container_id}"
          exit_code="$(docker wait "${container_id}")"
          docker rm "${container_id}" >/dev/null
          exit "${exit_code}"
