target: all

multitenancy_enabled: false

server:
  http_listen_port: 9009
  grpc_listen_port: 9095

memberlist:
  join_members: []

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/mimir

ingester:
  ring:
    replication_factor: 1
    kvstore:
      store: memberlist

distributor:
  ring:
    kvstore:
      store: memberlist

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/blocks
  tsdb:
    dir: /data/mimir/tsdb

compactor:
  data_dir: /data/mimir/compactor
  sharding_ring:
    kvstore:
      store: memberlist

store_gateway:
  sharding_ring:
    replication_factor: 1
    kvstore:
      store: memberlist

ruler:
  enable_api: true
  rule_path: /data/mimir/rules
  ring:
    kvstore:
      store: memberlist

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/ruler-storage

alertmanager:
  data_dir: /data/mimir/alertmanager

frontend:
  log_queries_longer_than: 10s

query_scheduler:
  max_outstanding_requests_per_tenant: 100

limits:
  ingestion_rate: 100000
  ingestion_burst_size: 200000
  max_global_series_per_user: 1000000
