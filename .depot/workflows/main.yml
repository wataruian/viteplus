# Depot CI Migration
# Source: .github/workflows/main.yml
#
# Changes made:
# - Rewrote .github/ path references to .depot/

name: 'Main Pipeline'
on:
  push:
    branches: [main, ci]
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  develop:
    permissions:
      contents: read
      actions: write
    uses: ./.depot/workflows/check.yml
    with:
      environment: develop
      cacheScope: develop
    secrets: inherit

