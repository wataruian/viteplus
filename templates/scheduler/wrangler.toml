name = "lightproject-scheduler"
main = "src/runtimes/edge.ts"

compatibility_date = "2026-08-26"
compatibility_flags = ["enable_request_signal"]

[triggers]
crons = ["*/5 * * * *"]

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[vars]
ENV = "local"
DATABASE_DIALECT = "d1"

[[d1_databases]]
binding = "DB"
database_name = "lightproject-datastore-local"
database_id = "lightproject-datastore-local"

[env.develop]
name = "lightproject-scheduler-dev"

[env.develop.vars]
ENV = "develop"
DATABASE_DIALECT = "d1"

[[env.develop.d1_databases]]
binding = "DB"
database_name = "lightproject-datastore-dev"
database_id = "ee37efb4-d241-4ca8-bbdc-4cbdca1195d0"

[env.staging]
name = "lightproject-scheduler-staging"

[env.staging.vars]
ENV = "staging"
DATABASE_DIALECT = "d1"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "lightproject-datastore-staging"
database_id = "c80ecad8-ef68-461a-aabb-f37bd13c77ee"

[env.production]
name = "lightproject-scheduler-production"

[env.production.vars]
ENV = "production"
DATABASE_DIALECT = "d1"

[[env.production.d1_databases]]
binding = "DB"
database_name = "lightproject-datastore-production"
database_id = "ef7a2585-f036-4fc3-b53c-ca8135ad728c"
