name = "lightproject-backend"
main = "src/runtimes/edge.ts"

compatibility_date = "2026-08-26"

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[observability.traces]
enabled = true
persist = true

[vars]
DATABASE_DIALECT = "d1"

[[d1_databases]]
binding = "DB"
database_name = "lightproject-datastore-local"
database_id = "lightproject-datastore-local"

[env.develop]
name = "lightproject-backend-dev"

[env.develop.vars]
ENV = "develop"
ALLOW_ALL_IPS = "true"
DATABASE_DIALECT = "d1"
ADDITIONAL_CORS_ORIGINS = "https://lightproject-backend-dev.wataru.workers.dev,https://lightproject-frontend-dev.wataru.workers.dev,https://lightproject-design-system-dev.wataru.workers.dev,https://lightproject-storybook-dev.wataru.workers.dev,https://lightproject-admin-dev.wataru.workers.dev,https://lightproject-site-dev.wataru.workers.dev"

[[env.develop.d1_databases]]
binding = "DB"
database_name = "lightproject-database-dev"
database_id = "9f1bf2ea-f0d4-4a0a-941d-7020ee0557a0"

[env.staging]
name = "lightproject-backend-staging"

[env.staging.vars]
ENV = "staging"
ALLOW_ALL_IPS = "true"
DATABASE_DIALECT = "d1"
ADDITIONAL_CORS_ORIGINS = "https://lightproject-backend-staging.wataru.workers.dev,https://lightproject-frontend-staging.wataru.workers.dev,https://lightproject-design-system-staging.wataru.workers.dev,https://lightproject-storybook-staging.wataru.workers.dev,https://lightproject-admin-staging.wataru.workers.dev,https://lightproject-site-staging.wataru.workers.dev"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "lightproject-database-staging"
database_id = "9aec85c6-8fdb-4d4e-8398-8fd6100ce5e6"

[env.production]
name = "lightproject-backend-production"

[env.production.vars]
ENV = "production"
ALLOW_ALL_IPS = "true"
DATABASE_DIALECT = "d1"
ADDITIONAL_CORS_ORIGINS = "https://lightproject-backend-production.wataru.workers.dev,https://lightproject-frontend-production.wataru.workers.dev,https://lightproject-design-system-production.wataru.workers.dev,https://lightproject-storybook-production.wataru.workers.dev,https://lightproject-admin-production.wataru.workers.dev,https://lightproject-site-production.wataru.workers.dev"

[[env.production.d1_databases]]
binding = "DB"
database_name = "lightproject-database-production"
database_id = "09adc8ae-43b3-4bd1-a517-7292fd83bb96"
