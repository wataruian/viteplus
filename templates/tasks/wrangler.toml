name = "lightproject-tasks"
main = "src/runtimes/edge.ts"

compatibility_date = "2026-08-26"

workers_dev = false
preview_urls = false

[triggers]
crons = ["* * * * *"]

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[vars]
ENV = "local"
JOB_STORE = "database"
DATABASE_DIALECT = "d1"

[[d1_databases]]
binding = "DB"
database_name = "lightproject-datastore-local"
database_id = "lightproject-datastore-local"

[[durable_objects.bindings]]
name = "WORKER_LOOP"
class_name = "WorkerLoop"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkerLoop"]

[env.develop]
name = "lightproject-tasks-dev"

[env.develop.vars]
ENV = "develop"
JOB_STORE = "database"
DATABASE_DIALECT = "d1"

[[env.develop.d1_databases]]
binding = "DB"
database_name = "lightproject-datastore-dev"
database_id = "ee37efb4-d241-4ca8-bbdc-4cbdca1195d0"

[[env.develop.durable_objects.bindings]]
name = "WORKER_LOOP"
class_name = "WorkerLoop"

[env.staging]
name = "lightproject-tasks-staging"

[env.staging.vars]
ENV = "staging"
JOB_STORE = "database"
DATABASE_DIALECT = "d1"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "lightproject-datastore-staging"
database_id = "c80ecad8-ef68-461a-aabb-f37bd13c77ee"

[[env.staging.durable_objects.bindings]]
name = "WORKER_LOOP"
class_name = "WorkerLoop"

[env.production]
name = "lightproject-tasks-production"

[env.production.vars]
ENV = "production"
JOB_STORE = "database"
DATABASE_DIALECT = "d1"

[[env.production.d1_databases]]
binding = "DB"
database_name = "lightproject-datastore-production"
database_id = "ef7a2585-f036-4fc3-b53c-ca8135ad728c"

[[env.production.durable_objects.bindings]]
name = "WORKER_LOOP"
class_name = "WorkerLoop"
