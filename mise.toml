#:tombi schema.strict = false

# monorepo_root = true

# [monorepo]
# config_roots = ["apps/*", "packages/*", "templates/*"]

[settings]
experimental = true

[bootstrap.mise_shell_activate]
zprofile = { enabled = true, mode = "shims" }
zshrc = { enabled = true, mode = "activate" }
bash_profile = { enabled = true, mode = "shims" }
bashrc = { enabled = true, mode = "activate" }

[tools]
gh = "2.100.0"
dagger = "0.21.9"
jq = "1.7.1"
cloudflared = "2026.9.1"
# viteplus = "1.4.0"

# remove this workaround when https://github.com/voidzero-dev/vite-plus/issues/943 is fixed
[tools."github:voidzero-dev/vite-plus"]
version = "1.4.0"
postinstall = '''
cd "$MISE_TOOL_INSTALL_PATH"
ln -sf vp vpr
ln -sf vp vpx
'''

[env]
_.file = ".env"

[task_config]
dir = "{{config_root}}"
