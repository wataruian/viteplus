version: '3.9'

services:
  loki-storage-init:
    image: busybox:1.38.0
    container_name: loki-storage-init
    command: chown -R 10001:10001 /tmp/loki
    volumes:
      - loki-storage:/tmp/loki

  loki:
    image: grafana/loki:3.5.3
    container_name: loki
    restart: unless-stopped
    ports:
      - '3100:3100'
    command:
      - -config.file=/etc/loki.yaml
    volumes:
      - ./configs/loki.yaml:/etc/loki.yaml
      - loki-storage:/tmp/loki
    depends_on:
      loki-storage-init:
        condition: service_completed_successfully

  grafana-storage-init:
    image: busybox:1.38.0
    container_name: grafana-storage-init
    command: chown -R 472:472 /var/lib/grafana
    volumes:
      - grafana-storage:/var/lib/grafana

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - '3300:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
      - grafana-storage:/var/lib/grafana
    depends_on:
      grafana-storage-init:
        condition: service_completed_successfully
      loki:
        condition: service_started
      tempo:
        condition: service_started
      mimir:
        condition: service_started

  tempo-storage-init:
    image: busybox:1.38.0
    container_name: tempo-storage-init
    command: chown -R 10001:10001 /tmp/tempo
    volumes:
      - tempo-storage:/tmp/tempo

  tempo:
    image: grafana/tempo:2.8.1
    container_name: tempo
    restart: unless-stopped
    ports:
      - '3200:3200'
    command:
      - -config.file=/etc/tempo.yaml
    volumes:
      - ./configs/tempo.yaml:/etc/tempo.yaml
      - tempo-storage:/tmp/tempo
    depends_on:
      tempo-storage-init:
        condition: service_completed_successfully

  mimir:
    image: grafana/mimir:2.17.0
    container_name: mimir
    restart: unless-stopped
    ports:
      - '9009:9009'
      - '9095:9095'
    command:
      - -config.file=/etc/mimir.yaml
    volumes:
      - ./configs/mimir.yaml:/etc/mimir.yaml
      - mimir-storage:/data/mimir

  otel-storage-init:
    image: busybox:1.38.0
    container_name: otel-storage-init
    command: chown -R 10001:10001 /var/lib/otelcol
    volumes:
      - otel-storage:/var/lib/otelcol

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    container_name: otel-collector
    restart: unless-stopped
    ports:
      - '4317:4317'
      - '4318:4318'
      - '12347:12347'
    command:
      - --config=/etc/otelcol/config.yaml
    volumes:
      - ./configs/otel-collector-config.yaml:/etc/otelcol/config.yaml
      - otel-storage:/var/lib/otelcol
    depends_on:
      otel-storage-init:
        condition: service_completed_successfully
      grafana:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
      mimir:
        condition: service_started

  dagger-engine:
    image: registry.dagger.io/engine:v0.21.9
    container_name: dagger-engine
    restart: unless-stopped
    privileged: true
    environment:
      DAGGER_NO_NAG: '1'
    volumes:
      - dagger-engine-storage:/var/lib/dagger
      - ./configs/dagger-engine.json:/etc/dagger/engine.json

  github-runner:
    image: myoung34/github-runner:2.337.0-ubuntu-noble
    container_name: github-runner
    restart: unless-stopped
    environment:
      REPO_URL: ${GH_REPO_URL}
      ACCESS_TOKEN: ${GH_RUNNER_TOKEN}
      RUNNER_NAME: ${GH_RUNNER_NAME:-gh-runner-1}
      RUNNER_SCOPE: repo
      LABELS: self-hosted,linux,arm64,dagger
      EPHEMERAL: '1'
      DISABLE_AUTO_UPDATE: 'true'
      RUNNER_WORKDIR: /tmp/runner/work
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://dagger-engine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - github-runner-work:/tmp/runner/work
    depends_on:
      - dagger-engine

volumes:
  grafana-storage:
  loki-storage:
  mimir-storage:
  otel-storage:
  tempo-storage:
  dagger-engine-storage:
  github-runner-work:
