version: '3.9'

services:
  loki-storage-init:
    image: busybox:1.38.0
    container_name: loki-storage-init
    command: chown -R 10001:10001 /tmp/loki
    volumes:
      - loki-storage:/tmp/loki

  loki:
    image: grafana/loki:3.5.3
    container_name: loki
    ports:
      - '3100:3100'
    command:
      - -config.file=/etc/loki.yaml
    volumes:
      - ./configs/loki.yaml:/etc/loki.yaml
      - loki-storage:/tmp/loki
    depends_on:
      loki-storage-init:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    ports:
      - '3300:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
      - grafana-storage:/var/lib/grafana
    depends_on:
      - loki
      - tempo
      - mimir

  tempo-storage-init:
    image: busybox:1.38.0
    container_name: tempo-storage-init
    command: chown -R 10001:10001 /tmp/tempo
    volumes:
      - tempo-storage:/tmp/tempo

  tempo:
    image: grafana/tempo:2.8.1
    container_name: tempo
    ports:
      - '3200:3200'
    command:
      - -config.file=/etc/tempo.yaml
    volumes:
      - ./configs/tempo.yaml:/etc/tempo.yaml
      - tempo-storage:/tmp/tempo
    depends_on:
      tempo-storage-init:
        condition: service_completed_successfully

  mimir:
    image: grafana/mimir:2.17.0
    container_name: mimir
    ports:
      - '9009:9009'
      - '9095:9095'
    command:
      - -config.file=/etc/mimir.yaml
    volumes:
      - ./configs/mimir.yaml:/etc/mimir.yaml
      - mimir-storage:/data/mimir

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    container_name: otel-collector
    ports:
      - '4317:4317'
      - '4318:4318'
      - '12347:12347'
    command:
      - --config=/etc/otelcol/config.yaml
    volumes:
      - ./configs/otel-collector-config.yaml:/etc/otelcol/config.yaml
    depends_on:
      - loki
      - grafana
      - tempo
      - mimir

volumes:
  grafana-storage:
  loki-storage:
  mimir-storage:
  tempo-storage:
