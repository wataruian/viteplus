version: '3.9'

services:
  loki-storage-init:
    image: busybox:1.38.0
    container_name: loki-storage-init
    command: chown -R 10001:10001 /tmp/loki
    volumes:
      - loki-storage:/tmp/loki

  loki:
    image: grafana/loki:3.5.3
    container_name: loki
    restart: unless-stopped
    ports:
      - '3100:3100'
    command:
      - -config.file=/etc/loki.yaml
    volumes:
      - ./configs/loki.yaml:/etc/loki.yaml
      - loki-storage:/tmp/loki
    depends_on:
      loki-storage-init:
        condition: service_completed_successfully

  grafana-storage-init:
    image: busybox:1.38.0
    container_name: grafana-storage-init
    command: chown -R 472:472 /var/lib/grafana
    volumes:
      - grafana-storage:/var/lib/grafana

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - '3300:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
      - grafana-storage:/var/lib/grafana
    depends_on:
      grafana-storage-init:
        condition: service_completed_successfully
      loki:
        condition: service_started
      tempo:
        condition: service_started
      mimir:
        condition: service_started

  tempo-storage-init:
    image: busybox:1.38.0
    container_name: tempo-storage-init
    command: chown -R 10001:10001 /tmp/tempo
    volumes:
      - tempo-storage:/tmp/tempo

  tempo:
    image: grafana/tempo:2.8.1
    container_name: tempo
    restart: unless-stopped
    ports:
      - '3200:3200'
    command:
      - -config.file=/etc/tempo.yaml
    volumes:
      - ./configs/tempo.yaml:/etc/tempo.yaml
      - tempo-storage:/tmp/tempo
    depends_on:
      tempo-storage-init:
        condition: service_completed_successfully

  mimir:
    image: grafana/mimir:2.17.0
    container_name: mimir
    restart: unless-stopped
    ports:
      - '9009:9009'
      - '9095:9095'
    command:
      - -config.file=/etc/mimir.yaml
    volumes:
      - ./configs/mimir.yaml:/etc/mimir.yaml
      - mimir-storage:/data/mimir

  otel-storage-init:
    image: busybox:1.38.0
    container_name: otel-storage-init
    command: chown -R 10001:10001 /var/lib/otelcol
    volumes:
      - otel-storage:/var/lib/otelcol

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    container_name: otel-collector
    restart: unless-stopped
    ports:
      - '4317:4317'
      - '4318:4318'
      - '12347:12347'
    command:
      - --config=/etc/otelcol/config.yaml
    volumes:
      - ./configs/otel-collector-config.yaml:/etc/otelcol/config.yaml
      - otel-storage:/var/lib/otelcol
    depends_on:
      otel-storage-init:
        condition: service_completed_successfully
      grafana:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
      mimir:
        condition: service_started

  registry-cache:
    image: rpardini/docker-registry-proxy:0.7.0
    container_name: registry-cache
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.28.0.10
    ports:
      - '3128:3128'
    environment:
      REGISTRIES: ghcr.io
      ENABLE_MANIFEST_CACHE: 'true'
      DISABLE_IPV6: 'true'
    volumes:
      - registry-cache-data:/docker_mirror_cache
      - registry-cache-certs:/ca
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3128/ca.crt']
      interval: 5s
      timeout: 3s
      retries: 10

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - '9010:9000'
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-extensions:/opt/sonarqube/extensions
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://127.0.0.1:9000/api/system/status | grep -q ''"status":"UP"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 15m

  dagger-engine:
    image: registry.dagger.io/engine:v0.21.9
    container_name: dagger-engine
    restart: unless-stopped
    privileged: true
    environment:
      DAGGER_NO_NAG: '1'
      HTTP_PROXY: http://172.28.0.10:3128
      HTTPS_PROXY: http://172.28.0.10:3128
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - dagger-engine-storage:/var/lib/dagger
      - ./configs/dagger-engine.toml:/etc/dagger/engine.toml
      - registry-cache-certs:/usr/local/share/ca-certificates
    depends_on:
      registry-cache:
        condition: service_healthy

  github-runner:
    image: myoung34/github-runner:2.337.0-ubuntu-noble
    restart: unless-stopped
    deploy:
      replicas: ${GH_RUNNER_MIN}
    environment:
      REPO_URL: ${GH_REPO_URL}
      ACCESS_TOKEN: ${GH_RUNNER_TOKEN}
      RUNNER_NAME_PREFIX: ${GH_RUNNER_NAME}
      RANDOM_RUNNER_SUFFIX: 'false'
      RUNNER_SCOPE: repo
      LABELS: self-hosted,linux,arm64,dagger
      EPHEMERAL: '1'
      DISABLE_AUTO_UPDATE: 'true'
      RUNNER_WORKDIR_ROOT: /tmp/runner/work
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: ${_EXPERIMENTAL_DAGGER_RUNNER_HOST}
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      registry-cache:
        condition: service_healthy
      dagger-engine:
        condition: service_started
      sonarqube:
        condition: service_healthy

  runner-scaler:
    image: docker:27.5.1-cli
    container_name: runner-scaler
    restart: unless-stopped
    working_dir: /workspace
    environment:
      GH_REPO_URL: ${GH_REPO_URL}
      GH_RUNNER_TOKEN: ${GH_RUNNER_TOKEN}
      GH_RUNNER_NAME: ${GH_RUNNER_NAME}
      GH_RUNNER_MIN: ${GH_RUNNER_MIN}
      GH_RUNNER_MAX: ${GH_RUNNER_MAX}
      SCALE_INTERVAL_SECONDS: ${GH_RUNNER_SCALE_INTERVAL_SECONDS}
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - .:/workspace:ro
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        apk add --no-cache bash=5.2.37-r0 curl=8.14.1-r2 jq=1.7.1-r0
        while true; do
          bash /workspace/.mise/tasks/scale-runners || echo "scale-runners failed (exit $?), will retry next tick"
          sleep "$${SCALE_INTERVAL_SECONDS}"
        done
    depends_on:
      dagger-engine:
        condition: service_started
      github-runner:
        condition: service_started

volumes:
  grafana-storage:
  loki-storage:
  mimir-storage:
  otel-storage:
  tempo-storage:
  dagger-engine-storage:
  registry-cache-data:
  registry-cache-certs:
  sonarqube-data:
  sonarqube-logs:
  sonarqube-extensions:

networks:
  default:
    name: viteplus-net
    ipam:
      config:
        - subnet: 172.28.0.0/16
